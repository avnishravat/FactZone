<head>

    <script type="application/ld+json">
    {
      "@context": "https://schema.org",

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }

        .breadcrumbs { font-size: 13px; color: #64748b; margin-bottom: 16px; }
        .breadcrumbs a { color: #2563eb; text-decoration: none; }
        .card { background: #ffffff; border-radius: 8px; padding: 20px; border: 1px solid #e2e8f0; margin-bottom: 16px; }
        input[type="file"] { margin: 15px 0; width: 100%; }
        .btn { background-color: #2563eb; color: white; border: none; padding: 8px 16px; border-radius: 6px; cursor: pointer; font-weight: 500; font-size: 14px; }

<div class="main-container">
    <nav class="breadcrumbs">

    <div class="card">
        <h2>📝 Word to PDF Converter</h2>
        <p style="font-size: 13px; color: #64748b; margin-top: 4px;">Upload your Word document (.doc, .docx) to export as a clean PDF file.</p>
        <input type="file" id="wordInput" accept=".doc,.docx,.txt">
        <button class="btn" onclick="convertWord()">Convert to PDF</button>
    </div>
</div>

<script>
    function convertWord() {
        const file = document.getElementById('wordInput').files[0];
        if (!file) return alert('Please select a Word document first.');
        alert('File uploaded! Exporting PDF...');
    }
</script>
