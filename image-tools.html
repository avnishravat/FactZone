    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: #f8fafc; color: #1e293b; min-height: 100vh; display: flex; flex-direction: column; }
        .main-container { width: 100%; max-width: 700px; margin: 0 auto; padding: 20px 16px; flex: 1; }
        .breadcrumbs { font-size: 13px; color: #64748b; margin-bottom: 16px; }
        .breadcrumbs a { color: #2563eb; text-decoration: none; }
        .breadcrumbs span { margin: 0 6px; color: #94a3b8; }
        .card { background: #ffffff; border-radius: 8px; padding: 16px; border: 1px solid #e2e8f0; margin-bottom: 16px; }
        .card-header { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
        .card-header h1 { font-size: 20px; font-weight: 700; color: #0f172a; }
        input[type="file"] { margin: 12px 0; width: 100%; font-size: 13px; }
        .btn { background-color: #2563eb; color: white; border: none; padding: 8px 16px; border-radius: 6px; cursor: pointer; font-weight: 500; font-size: 13px; }
        .btn:hover { background-color: #1d4ed8; }
        #preview { max-width: 100%; height: auto; margin-top: 15px; border-radius: 6px; display: none; }
        .site-footer { background-color: #ffffff; border-top: 1px solid #e2e8f0; padding: 20px 16px; margin-top: 40px; font-size: 13px; color: #64748b; }
        .footer-inner { max-width: 700px; margin: 0 auto; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px; }
        .footer-links a { color: #475569; text-decoration: none; margin-left: 12px; }
    </style>
</head>
<body>
<div class="main-container">
    <nav class="breadcrumbs">
        <a href="https://factzone.online/">Home</a><span>/</span><a href="tools.html">Tools</a><span>/</span><strong>Image Tools</strong>
    </nav>
    <main class="card">
        <div class="card-header">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#2563eb" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
                <circle cx="8.5" cy="8.5" r="1.5"></circle>
                <polyline points="21 15 16 10 5 21"></polyline>
            </svg>
            <h1>Image & Design Tools</h1>
        </div>
        <p style="font-size: 13px; color: #64748b; margin-bottom: 10px;">Upload an image to optimize or process client-side.</p>
        <input type="file" id="imageInput" accept="image/*">
        <button class="btn" onclick="processImage()">Optimize Image</button>
        <br>
        <img id="preview" alt="Optimized Preview">
        <a id="downloadLink" class="btn" style="display:none; margin-top:10px; text-decoration:none; display:inline-block;">Download Image</a>
    </main>
</div>
<footer class="site-footer">
    <div class="footer-inner">
        <div>© 2026 <strong>factzone.online</strong>. All rights reserved.</div>
        <div class="footer-links">
            <a href="https://factzone.online/">Home</a>
            <a href="tools.html">Tools</a>
        </div>
    </div>
</footer>
<script>
    function processImage() {
        const file = document.getElementById('imageInput').files[0];
        if (!file) return alert('Please select an image file');
        const img = document.getElementById('preview');
        const link = document.getElementById('downloadLink');
        const reader = new FileReader();
        reader.onload = e => {
            img.src = e.target.result;
            img.style.display = 'block';
            link.href = e.target.result;
            link.download = 'optimized-' + file.name;
            link.style.display = 'inline-block';
        };
        reader.readAsDataURL(file);
    }
</script>
</body>
</html>
