            color: var(--text-sub);
            margin-bottom: 1.2rem;
            display: flex;
            align-items: center;
            gap: 6px;

        /* Header */

        .header-content { text-align: left; }
        h1 { font-size: 1.5rem; color: var(--text-main); font-weight: 800; }
        p.subtitle { color: var(--text-sub); font-size: 0.85rem; margin-top: 0.25rem; }
        
        /* Dark Mode Toggle */
        .theme-toggle {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            width: 38px;
            height: 38px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 1px 2px 0 rgba(0,0,0,0.05);
        }
        .theme-toggle svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
        
        /* Filter Container */
        .filter-container { 
            display: flex; 
            flex-direction: row; 
            gap: 10px; 
            max-width: 550px; 
            margin: 0 auto 2rem auto; 
            width: 100%;
        }
        .search-bar { 
            flex: 2; 
            height: 40px; 
            padding: 0 0.85rem; 
            border: 1px solid var(--border-color); 
            border-radius: 8px; 
            font-size: 0.85rem; 
            outline: none; 
            background: var(--input-bg);
            color: var(--text-main);
        }
        .category-select { 
            flex: 1; 
            height: 40px; 
            padding: 0 0.6rem; 
            border: 1px solid var(--border-color); 
            border-radius: 8px; 
            font-size: 0.85rem; 
            background-color: var(--input-bg); 
            color: var(--text-main); 
            outline: none; 
            cursor: pointer; 
        }
        .search-bar:focus, .category-select:focus { 
            border-color: #3b82f6; 
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.15); 
        }
        
        /* Prompts Grid */
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 1.25rem; }
        
        /* Prompt Card */
        .card { 
            background: var(--card-bg); 
            border: 1px solid var(--border-color); 
            border-radius: 12px; 
            padding: 1.25rem; 
            display: flex; 
            flex-direction: column; 
            justify-content: space-between;
            box-shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.04);
            transition: transform 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease;
        }
        .card:hover { 
            transform: translateY(-4px); 
            box-shadow: 0 10px 20px -5px rgba(0, 0, 0, 0.1); 
            border-color: #3b82f6;
        }
        
        .card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.75rem; }
        
        /* Badges */
        .badge { 
            display: inline-flex;
            align-items: center;
            font-size: 0.68rem; 
            font-weight: 700; 
            padding: 0.25rem 0.6rem; 
            border-radius: 20px; 
            text-transform: uppercase; 
            letter-spacing: 0.03em;
            background-color: #e2e8f0;
            color: #334155;
        }

        .card h3 { font-size: 1.05rem; font-weight: 700; color: var(--text-main); margin-bottom: 0.6rem; }
        
        /* Prompt Text Box */
        .prompt-box { 
            background: var(--prompt-bg); 
            border: 1px solid var(--prompt-border); 
            padding: 0.85rem; 
            border-radius: 8px; 
            font-size: 0.82rem; 
            color: var(--prompt-text); 
            line-height: 1.5;
            margin-bottom: 1.2rem; 
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; 
            white-space: pre-wrap; 
            word-break: break-word; 
            max-height: 110px;
            overflow-y: auto;
        }
        
        /* Copy Button */
        .card-footer { display: flex; justify-content: flex-end; }
        .copy-btn { 
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background-color: var(--btn-bg); 
            color: var(--btn-text); 
            border: none; 
            padding: 0.5rem 0.9rem; 
            border-radius: 7px; 
            font-size: 0.78rem; 
            font-weight: 600; 
            cursor: pointer; 
            transition: background 0.2s, transform 0.1s; 
        }
        .copy-btn:hover { background-color: var(--btn-hover); }
        .copy-btn:active { transform: scale(0.97); }
        .copy-btn.copied { background-color: #16a34a !important; color: #ffffff !important; }
        .copy-btn svg { width: 14px; height: 14px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

        @media (max-width: 500px) {
            body { padding: 1rem 0.75rem; }
            .grid { grid-template-columns: 1fr; }
        }

        function renderPrompts(prompts) {
            const grid = document.getElementById('promptGrid');
            grid.innerHTML = '';

            if (prompts.length === 0) {
                grid.innerHTML = '<p style="grid-column: 1/-1; text-align: center; color: var(--text-sub); padding: 2rem;">No prompts found matching your search query.</p>';
                return;
            }

            prompts.forEach((item, idx) => {
                const card = document.createElement('div');
                card.className = 'card';
                card.innerHTML = `
                    <div>
                        <div class="card-header">
                            <span class="badge">${item.cat}</span>
                        </div>
                        <h3>${item.title}</h3>
                        <div class="prompt-box" id="p_${idx}">${item.text}</div>
                    </div>
                    <div class="card-footer">
                        <button class="copy-btn" onclick="copyPrompt('p_${idx}', this)">
                            <svg viewBox="0 0 24 24"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
                            <span>Copy</span>
                        </button>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        function filterPrompts() {
            const search = document.getElementById('searchInput').value.toLowerCase();
            const categorySelect = document.getElementById('categorySelect');
            const category = categorySelect.value;
            const breadcrumbCat = document.getElementById('breadcrumbCategory');

            if (category === 'all') {
                breadcrumbCat.innerText = 'All Categories';
            } else {
                const selectedText = categorySelect.options[categorySelect.selectedIndex].text;
                breadcrumbCat.innerText = selectedText.split(' ')[0];
            }

            const filtered = promptList.filter(item => {
                const matchesSearch = item.title.toLowerCase().includes(search) || item.text.toLowerCase().includes(search);
                const matchesCat = category === 'all' || item.cat === category;
                return matchesSearch && matchesCat;
            });

            renderPrompts(filtered);
        }

        function copyPrompt(elementId, btn) {
            const text = document.getElementById(elementId).innerText;
            const btnText = btn.querySelector('span');
            
            function showSuccess() {
                const originalText = btnText.innerText;
                btnText.innerText = "Copied!";
                btn.classList.add("copied");
                setTimeout(() => {
                    btnText.innerText = originalText;
                    btn.classList.remove("copied");
                }, 2000);
            }

            if (navigator.clipboard && window.isSecureContext) {
                navigator.clipboard.writeText(text).then(showSuccess).catch(() => {
                    fallbackCopy(text, showSuccess);
                });
            } else {
                fallbackCopy(text, showSuccess);
            }
        }

        function fallbackCopy(text, callback) {
            const textArea = document.createElement("textarea");
            textArea.value = text;
            textArea.style.position = "fixed";
            textArea.style.left = "-999999px";
            textArea.style.top = "-999999px";
            document.body.appendChild(textArea);
            textArea.focus();
            textArea.select();
            try {
                document.execCommand('copy');
                if (callback) callback();
            } catch (err) {
                console.error('Fallback copy failed: ', err);
            }
            document.body.removeChild(textArea);
        }

        const currentTheme = localStorage.getItem('theme') || 'light';
        document.body.setAttribute('data-theme', currentTheme);
        updateThemeIcon(currentTheme);

        function toggleTheme() {
            const body = document.body;
            let theme = body.getAttribute('data-theme') === 'light' ? 'dark' : 'light';
            body.setAttribute('data-theme', theme);
            localStorage.setItem('theme', theme);
            updateThemeIcon(theme);
        }

        function updateThemeIcon(theme) {
            document.getElementById('sunIcon').style.display = theme === 'dark' ? 'block' : 'none';
            document.getElementById('moonIcon').style.display = theme === 'dark' ? 'none' : 'block';
        }

        renderPrompts(promptList);
    </script>
