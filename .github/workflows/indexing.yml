name: Smart Google Indexing

on:
  workflow_dispatch:

  schedule:
    # हर दिन 12:00 AM UTC = 5:30 AM IST
    - cron: '0 0 * * *'

  push:
    branches:
      - main

jobs:
  index-urls:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Google APIs Library
        run: npm install googleapis

      - name: Run Smart Indexing Script
        env:
          INDEXING_KEY: ${{ secrets.INDEXING_KEY }}
        run: node scripts/index-urls.js
