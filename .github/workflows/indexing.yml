name: Google Indexing API

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  index-urls:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install Dependencies
        run: npm install googleapis

      - name: Run Indexing Script
        env:
          INDEXING_KEY: ${{ secrets.INDEXING_KEY }}
        run: node scripts/index-urls.js
