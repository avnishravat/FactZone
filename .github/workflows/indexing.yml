name: Smart Google Indexing

on:
  workflow_dispatch: # Manual trigger GitHub dashboard se
  schedule:
    - cron: '0 0 * * *' # Har din raat 12:00 AM UTC par chalega
  push:
    branches:
      - main # Code push hone par chalega

jobs:
  index-urls:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '20' # Node.js 20 me fetch api natively available hai

      - name: Install Google APIs Library
        run: npm install googleapis

      - name: Run Smart Indexing Script
        env:
          INDEXING_KEY: ${{ secrets.INDEXING_KEY }}
        run: node scripts/index-urls.js
