name: Generate Static Posts & Process Images

on:
  push:
    paths:
      - 'data/posts/**'
      - 'raw-images/**'
      - 'scripts/**'
      - 'templates/**'
      - 'index.html'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/generate-posts.yml'
  workflow_dispatch:

concurrency:
  group: factzone-static-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: npm install --no-audit

      - name: Run Full SSG Build
        run: npm run build

      - name: Commit and Push Changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          
          # Create empty tracking files if folders don't exist
          mkdir -p assets/images/posts posts
          
          git add assets/images/posts/ posts/ index.html posts-index.json categories/ sitemap.xml package.json package-lock.json data/posts/ || true
          
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Auto-build: Processed WebP images & generated static pages [skip ci]"
            git push
          fi
