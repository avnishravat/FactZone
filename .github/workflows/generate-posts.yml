name: Generate Static Posts & Process Images

on:
  push:
    paths:
      - 'data/posts/**'
      - 'raw-images/**'
      - 'templates/**'
      - 'scripts/**'
      - 'index.html'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Dependencies
        run: npm install --no-audit
      - name: Run Full SSG Build
        run: npm run build
      - name: Commit Generated Site
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add assets/images/posts/ posts/ categories/ index.html posts-index.json sitemap.xml data/posts/ raw-images/ templates/ scripts/ package.json package-lock.json
          if git diff --staged --quiet; then
            echo "No generated changes"
          else
            git commit -m "Auto-build: regenerate static FactZone pages [skip ci]"
            git push
          fi
