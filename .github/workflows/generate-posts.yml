name: Generate Static Posts & Process Images

on:
  push:
    branches:
      - main
    paths:
      - 'data/posts/**'
      - 'raw-images/**'
      - 'assets/images/posts/**'
      - 'scripts/**'
      - 'templates/**'
      - 'index.html'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/generate-posts.yml'
  workflow_dispatch:

concurrency:
  group: factzone-static-build-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: npm install --no-audit

      - name: Run Full SSG Build
        run: npm run build

      - name: Commit and Push Generated Static Files
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          mkdir -p assets/images/posts posts
          git add assets/images/posts/ posts/ index.html posts-index.json categories/ sitemap.xml package.json package-lock.json data/posts/ || true
          if git diff --staged --quiet; then
            echo "No generated changes to commit"
          else
            git commit -m "Auto-build: Processed WebP images & generated static pages"
            git push
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Static Site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy Static Site
        id: deployment
        uses: actions/deploy-pages@v4
