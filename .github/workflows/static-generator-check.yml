name: Check static generator

on:
  push:
    branches:
      - safe-incremental-static
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  syntax-and-dependencies:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install locked dependencies
        run: npm ci
      - name: Check generator JavaScript syntax
        run: node --check scripts/generate-static.js
