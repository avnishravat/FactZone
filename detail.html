  function injectInlineAdsDom(rawHtml, count, adHtmlString) {
    if (!rawHtml) return rawHtml;
    var tmp = document.createElement('div');
    tmp.innerHTML = rawHtml;
    var children = Array.prototype.slice.call(tmp.childNodes).filter(function(n) {
      return n.nodeType === 1 || (n.nodeType === 3 && n.textContent.trim() !== '');
    });
    if (children.length < 2) return rawHtml;

    var totalGaps = children.length - 1;
    var slots = Math.min(count, totalGaps);
    if (slots < 1) return rawHtml;

    var insertAfter = [];
    var used = {};
    for (var i = 1; i <= slots; i++) {
      var pos = Math.round((i * totalGaps) / (slots + 1)) - 1;
      pos = Math.max(0, Math.min(totalGaps - 1, pos));
      while (used[pos] && pos < totalGaps - 1) pos++;
      used[pos] = true;
      insertAfter.push(pos);
    }

    var out = '';
    children.forEach(function(node, idx) {
      out += (node.nodeType === 1) ? node.outerHTML : node.textContent;
      if (insertAfter.indexOf(idx) !== -1) out += adHtmlString;
    });
    return out;
  }

  function renderPost(post) {

    var descRaw    = contentRaw.replace(/<[^>]*>/g, '').replace(/\n/g," ");
    var desc       = descRaw.substring(0, 160);

    var createdDate  = toSafeDate(post.createdAt);
    var publishedISO = createdDate ? createdDate.toISOString() : new Date().toISOString();
    var updatedDate  = toSafeDate(post.updatedAt);
    var updatedISO   = updatedDate ? updatedDate.toISOString() : publishedISO;
    var keywords   = Array.isArray(post.tags) && post.tags.length ? post.tags.join(", ") : "amazing facts, science facts, hindi facts";

    var cleanTextForReadTime = contentRaw.replace(/<[^>]*>/g, '');
    var wordCount = cleanTextForReadTime.trim().split(/\s+/).filter(Boolean).length;

    currentPostCategory = post.category || null;
    maybeResortRelated();
    fetchRelatedByCategory(currentPostCategory);

  var currentPostCategory = null;
  var relatedItemsRaw = null;

  function maybeResortRelated() {
    if (!relatedItemsRaw) return;
    var items = relatedItemsRaw;
    if (currentPostCategory) {
      items = items.slice().sort(function(a, b) {
        var aMatch = (a.category === currentPostCategory) ? 0 : 1;
        var bMatch = (b.category === currentPostCategory) ? 0 : 1;
        return aMatch - bMatch;
      });
    }
    renderRelated(items);
  }

  var CATEGORY_CACHE_PREFIX = "fz-related-cat-";

  function fetchRelatedByCategory(category) {
    if (!category) return;

    var cacheKey = CATEGORY_CACHE_PREFIX + category;
    var cachedRaw = ssGet(cacheKey);
    if (cachedRaw) {
      try {
        var parsed = JSON.parse(cachedRaw);
        if (Date.now() - parsed.ts < RELATED_TTL_MS) {
          relatedItemsRaw = parsed.data;
          maybeResortRelated();
          return;
        }
      } catch (e) {}
    }

    function finalizeItems(docs) {
      var items = [];
      docs.forEach(function(d) {
        if (!d.document) return;
        var pid = (d.document.name || "").split("/").pop();
        var post = parseDoc(d.document.fields);
        post._id = pid;
        if ((slugParam && post.slug === slugParam) || (idParam && pid === idParam)) return;
        items.push(post);
      });
      return items;
    }

    function runQuery(body) {
      return fetch(FS_BASE + ":runQuery?key=" + API_KEY, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(body)
      }).then(function(r){ return r.json(); });
    }

    var queryWithOrder = {
      structuredQuery: {
        from: [{ collectionId: "posts" }],
        where: { fieldFilter: { field: { fieldPath: "category" }, op: "EQUAL", value: { stringValue: category } } },
        orderBy: [{ field: { fieldPath: "createdAt" }, direction: "DESCENDING" }]
      }
    };

    runQuery(queryWithOrder).then(function(data) {
      var docs = Array.isArray(data) ? data : [];
      var hasIndexError = docs.length === 1 && docs[0] && docs[0].error;
      if (hasIndexError) throw new Error("index-missing");
      var items = finalizeItems(docs);
      if (!items.length) throw new Error("empty");
      ssSet(cacheKey, JSON.stringify({ ts: Date.now(), data: items }));
      relatedItemsRaw = items;
      maybeResortRelated();
    }).catch(function() {
      var queryNoOrder = {
        structuredQuery: {
          from: [{ collectionId: "posts" }],
          where: { fieldFilter: { field: { fieldPath: "category" }, op: "EQUAL", value: { stringValue: category } } }
        }
      };
      runQuery(queryNoOrder).then(function(data) {
        var docs = Array.isArray(data) ? data : [];
        var items = finalizeItems(docs);
        if (!items.length) return;
        items.sort(function(a, b) {
          var ta = toSafeDate(a.createdAt); var tb = toSafeDate(b.createdAt);
          return (tb ? tb.getTime() : 0) - (ta ? ta.getTime() : 0);
        });
        ssSet(cacheKey, JSON.stringify({ ts: Date.now(), data: items }));
        relatedItemsRaw = items;
        maybeResortRelated();
      }).catch(function(e2) {
        console.warn("Category-based related fetch fully failed, keeping fallback list:", e2 && e2.message);
      });
    });
  }

  function renderRelated(items) {
    if (!items || !items.length) {
      $("relatedSection").style.display = "none";

    $("relatedGrid").innerHTML = items.map(function(item){

  function fetchPostByIdOnce(idVal) {
    var url = FS_BASE + "/posts/" + idVal + "?key=" + API_KEY;
    return fetch(url).then(function(r){ return r.json(); }).then(function(data){
      if (!data.fields) return null;

  function fetchPostBySlugOnce(slugVal) {
    var url = FS_BASE + ":runQuery?key=" + API_KEY;
    var body = {
      structuredQuery: {
        from: [{ collectionId: "posts" }],
        where: { fieldFilter: { field: { fieldPath: "slug" }, op: "EQUAL", value: { stringValue: slugVal } } },
        limit: 1
      }
    };
    return fetch(url, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) })
      .then(function(r){ return r.json(); })
      .then(function(data){
        var found = (Array.isArray(data) ? data : []).find(function(r){ return r.document; });
        if (!found) return null;
        var post = parseDoc(found.document.fields);
        post._id = found.document.name.split("/").pop();
        return post;
      });
  }

  function fetchPostOnce() {
    if (slugParam) return fetchPostBySlugOnce(slugParam);
    if (idParam)   return fetchPostByIdOnce(idParam);
    return Promise.resolve(null);
  }

  function fetchPostWithRetry(maxAttempts) {
    maxAttempts = maxAttempts || 4;
    var attempt = 1;
    function tryOnce() {
      return fetchPostOnce().catch(function(e) {
        console.warn("fetchPost attempt " + attempt + " failed:", e.message);
        return null;
      }).then(function(post) {
        if (post) return post;
        if (attempt >= maxAttempts) return null;
        attempt++;
        return sleep(400 + Math.pow(attempt, 2) * 300).then(tryOnce);
      });
    }
    return tryOnce();
  }

  function fetchPost() {
    if (!idParam && !slugParam) {
      $("post-content").innerHTML = '<div class="err"><h2>No article ID</h2><p>Go back and pick an article.</p></div>';
      return;
    }

    var cacheKey = currentCacheKey();
    var cachedRaw = ssGet(cacheKey);
    var cachedPost = null;
    if (cachedRaw) {
      try {
        var parsed = JSON.parse(cachedRaw);
        if (Date.now() - parsed.ts < CACHE_TTL_MS) {
          cachedPost = parsed.data;
          renderPost(cachedPost);
        }
      } catch (e) {}
    }

    cleanOldCacheEntries(cacheKey);

    fetchPostWithRetry().then(function(post) {
      if (!post) {
        if (!cachedPost) $("post-content").innerHTML = '<div class="err"><h2>Post Not Found</h2><p>This article may have been removed.</p></div>';
        return;
      }
      preloadHeroImage(post.image);
      ssSet(cacheKey, JSON.stringify({ ts: Date.now(), data: post }));
      renderPost(post);
    }).catch(function(err) {
      console.error("Post fetch error:", err);
      if (!cachedPost) $("post-content").innerHTML = '<div class="err"><h2>Failed to load</h2><p>Check your connection and refresh.</p></div>';
    });
  }

  function fetchAllPostDocs(pageToken, accumulated) {
    accumulated = accumulated || [];
    var url = FS_BASE + "/posts?key=" + API_KEY + "&pageSize=300" +
      (pageToken ? ("&pageToken=" + encodeURIComponent(pageToken)) : "");
    return fetch(url).then(function(r){ return r.json(); }).then(function(data){
      var docs = data.documents || [];
      accumulated = accumulated.concat(docs);
      if (data.nextPageToken) {
        return fetchAllPostDocs(data.nextPageToken, accumulated);
      }
      return accumulated;
    });
  }

  function fetchRelated() {
    var cachedRaw = ssGet(RELATED_CACHE_KEY);
    var cachedItems = null;
    if (cachedRaw) {
      try {
        var parsed = JSON.parse(cachedRaw);
        if (Date.now() - parsed.ts < RELATED_TTL_MS) {
          cachedItems = parsed.data;
          relatedItemsRaw = cachedItems;
          maybeResortRelated();
        }
      } catch (e) {}
    }

    fetchAllPostDocs()
      .then(function(docs){
        var items = [];
        docs.forEach(function(d){
          var pid = (d.name || "").split("/").pop();
          var post = parseDoc(d.fields);
          post._id = pid;
          if ((slugParam && post.slug === slugParam) || (idParam && pid === idParam)) return;
          items.push(post);
        });
        items.sort(function(a, b) {
          var ta = toSafeDate(a.createdAt); var tb = toSafeDate(b.createdAt);
          return (tb ? tb.getTime() : 0) - (ta ? ta.getTime() : 0);
        });
        ssSet(RELATED_CACHE_KEY, JSON.stringify({ ts: Date.now(), data: items }));
        relatedItemsRaw = items;
        maybeResortRelated();
      })
      .catch(function(e){
        console.error("Related fetch error:", e);
      });
  }

  fetchPost();
  fetchRelated();

})();
