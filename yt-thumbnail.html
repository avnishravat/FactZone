<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YouTube Thumbnail Downloader | FactZone</title>
    <meta name="description" content="Download high resolution YouTube cover thumbnails from any video URL.">
    <link rel="canonical" href="https://factzone.online/yt-thumbnail.html">

    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "BreadcrumbList",
      "itemListElement": [
        {"@type": "ListItem", "position": 1, "name": "Home", "item": "https://factzone.online/"},
        {"@type": "ListItem", "position": 2, "name": "Tools", "item": "https://factzone.online/tools.html"},
        {"@type": "ListItem", "position": 3, "name": "YT Thumbnail Downloader", "item": "https://factzone.online/yt-thumbnail.html"}
      ]
    }
    </script>

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: #f8fafc; color: #1e293b; min-height: 100vh; display: flex; flex-direction: column; }
        .main-container { width: 100%; max-width: 700px; margin: 0 auto; padding: 20px 16px; flex: 1; }
        .breadcrumbs { font-size: 13px; color: #64748b; margin-bottom: 16px; }
        .breadcrumbs a { color: #2563eb; text-decoration: none; }
        .card { background: #ffffff; border-radius: 8px; padding: 20px; border: 1px solid #e2e8f0; margin-bottom: 16px; }
        input[type="text"] { width: 100%; padding: 10px; border: 1px solid #cbd5e1; border-radius: 6px; margin: 8px 0 16px 0; outline: none; }
        .btn { background-color: #2563eb; color: white; border: none; padding: 10px 16px; border-radius: 6px; cursor: pointer; font-weight: 500; font-size: 14px; width: 100%; }
        .btn:hover { background-color: #1d4ed8; }
        #thumbPreview { width: 100%; height: auto; margin-top: 15px; border-radius: 6px; display: none; }
        .site-footer { background-color: #ffffff; border-top: 1px solid #e2e8f0; padding: 20px 16px; margin-top: 40px; font-size: 13px; color: #64748b; }
        .footer-inner { max-width: 700px; margin: 0 auto; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px; }
        .footer-links a { color: #475569; text-decoration: none; margin-left: 12px; }
    </style>
</head>
<body>

<div class="main-container">
    <nav class="breadcrumbs">
        <a href="https://factzone.online/">Home</a> / <a href="tools.html">Tools</a> / <strong>YT Thumbnail Downloader</strong>
    </nav>

    <div class="card">
        <h2>🖼️ YouTube Thumbnail Downloader</h2>
        <label style="font-size: 13px; color: #64748b;">YouTube Video Link</label>
        <input type="text" id="ytUrl" placeholder="https://www.youtube.com/watch?v=...">
        <button class="btn" onclick="fetchThumbnail()">Get HD Thumbnail</button>
        <img id="thumbPreview" alt="YouTube Thumbnail">
    </div>
</div>

<footer class="site-footer">
    <div class="footer-inner">
        <div>© 2026 <strong>factzone.online</strong></div>
        <div class="footer-links">
            <a href="https://factzone.online/">Home</a>
            <a href="tools.html">Tools</a>
        </div>
    </div>
</footer>

<script>
    function fetchThumbnail() {
        const url = document.getElementById('ytUrl').value.trim();
        let videoId = '';
        if (url.includes('v=')) {
            videoId = url.split('v=')[1].split('&')[0];
        } else if (url.includes('youtu.be/')) {
            videoId = url.split('youtu.be/')[1].split('?')[0];
        }
        if (!videoId) return alert('Please enter a valid YouTube video URL');
        const img = document.getElementById('thumbPreview');
        img.src = `https://img.youtube.com/vi/${videoId}/maxresdefault.jpg`;
        img.style.display = 'block';
    }
</script>
</body>
</html>
