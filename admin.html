<!doctype html>
<html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FactZone Admin</title><meta name="robots" content="noindex,nofollow">
<style>
body{font-family:system-ui,Arial;margin:0;background:#f4f6f8;color:#111827}.wrap{max-width:1050px;margin:auto;padding:20px}.card{background:#fff;border:1px solid #e5e7eb;border-radius:14px;padding:18px;margin:14px 0;box-shadow:0 4px 18px #0000000b}input,select,textarea{width:100%;box-sizing:border-box;padding:11px;border:1px solid #d1d5db;border-radius:9px;margin:5px 0 12px;font:inherit}textarea{min-height:260px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.btn{border:0;border-radius:9px;padding:11px 16px;cursor:pointer;font-weight:700}.primary{background:#2563eb;color:#fff}.danger{background:#fee2e2;color:#b91c1c}.muted{color:#6b7280;font-size:13px}.row{display:flex;gap:8px;flex-wrap:wrap}.post{border:1px solid #e5e7eb;border-radius:10px;padding:12px;margin:8px 0}.post h3{margin:0 0 5px;font-size:16px}.ok{color:#15803d}.err{color:#b91c1c}@media(max-width:700px){.grid{grid-template-columns:1fr}}
</style></head><body><div class="wrap">
<h1>FactZone Admin</h1>
<p class="muted">Cloud database हट चुका है। यह panel सीधे GitHub में <code>data/posts/*.json</code> save करता है। GitHub Actions फिर static HTML, categories और sitemap बनाता है.</p>
<div class="card"><h2>1. GitHub Access</h2><input id="token" type="password" placeholder="Fine-grained GitHub token (Contents: Read and write)"><div class="row"><button class="btn primary" id="connect">Connect</button><button class="btn" id="clearToken">Clear</button></div><p id="authMsg" class="muted"></p></div>
<div class="card"><h2>2. Article</h2><input id="oldSlug" type="hidden"><div class="grid"><div><label>Title</label><input id="title"></div><div><label>Slug</label><input id="slug" placeholder="my-article-title"></div><div><label>Category</label><select id="category"><option value="science">Science / विज्ञान</option><option value="tech">Tech / तकनीक</option><option value="history">History / इतिहास</option><option value="mystery">Mystery / रहस्य</option><option value="viral">Viral / रोचक तथ्य</option></select></div><div><label>Image URL</label><input id="image" placeholder="https://.../image.webp"></div></div><label>Description</label><textarea id="description" style="min-height:90px"></textarea><label>Article HTML</label><textarea id="content" placeholder="<p>Article...</p>"></textarea><div class="row"><button class="btn primary" id="save">Publish / Update</button><button class="btn" id="new">New</button></div><p id="saveMsg" class="muted"></p></div>
<div class="card"><h2>3. Existing Posts</h2><input id="search" placeholder="Search posts"><div id="list">Connect करके posts load करें.</div></div>
</div>
<script>
const OWNER="avnishravat",REPO="FactZone",BRANCH="main",API="https://api.github.com";
const $=id=>document.getElementById(id); let posts=[];
$("token").value=sessionStorage.getItem("fz_gh_token")||"";
function headers(){return{"Accept":"application/vnd.github+json","Authorization":"Bearer "+$("token").value,"X-GitHub-Api-Version":"2026-03-10","Content-Type":"application/json"}}
function msg(el,t,good=false){$(el).textContent=t;$(el).className=good?"ok":"err"}
async function api(path,opt={}){const r=await fetch(API+path,{...opt,headers:{...headers(),...(opt.headers||{})}});if(!r.ok){let x="GitHub API "+r.status;try{x+=(await r.json()).message?": "+(await r.json()).message:""}catch(e){}throw Error(x)}return r.status===204?null:r.json()}
async function connect(){try{const u=await api("/user");sessionStorage.setItem("fz_gh_token",$("token").value);msg("authMsg","Connected as "+u.login,true);await loadPosts()}catch(e){msg("authMsg",e.message)}}
async function loadPosts(){try{const r=await api("/repos/"+OWNER+"/"+REPO+"/contents/data/posts?ref="+BRANCH);posts=(r||[]).filter(x=>x.name.endsWith(".json"));render()}catch(e){msg("authMsg",e.message)}}
function render(){const q=$("search").value.toLowerCase();const a=posts.filter(p=>p.name.toLowerCase().includes(q));$("list").innerHTML=a.map(p=>"<div class='post'><h3>"+p.name.replace(/\.json$/,"")+"</h3><div class='row'><button class='btn' onclick='editPost("+JSON.stringify(p.name.slice(0,-5))+")'>Edit</button><button class='btn danger' onclick='deletePost("+JSON.stringify(p.name)+")'>Delete</button></div></div>").join("")||"No posts found."}
async function readPost(slug){const d=await api("/repos/"+OWNER+"/"+REPO+"/contents/data/posts/"+encodeURIComponent(slug)+".json?ref="+BRANCH);return{sha:d.sha,data:JSON.parse(decodeURIComponent(escape(atob(d.content.replace(/\n/g,""))))) }}
async function editPost(slug){try{const r=await readPost(slug),p=r.data;$("oldSlug").value=slug;$("title").value=p.title||"";$("slug").value=p.slug||slug;$("category").value=p.category||"science";$("image").value=p.image||"";$("description").value=p.description||p.desc||"";$("content").value=p.content||"";window.scrollTo({top:0,behavior:"smooth"})}catch(e){msg("saveMsg",e.message)}}
function newPost(){$("oldSlug").value="";$("title").value="";$("slug").value="";$("image").value="";$("description").value="";$("content").value="";$("category").value="science"}
function makeData(){const title=$("title").value.trim(),slug=$("slug").value.trim().toLowerCase();if(!title||!slug||!$("content").value.trim())throw Error("Title, slug और content जरूरी हैं.");return{id:slug,title,slug,category:$("category").value,image:$("image").value.trim(),description:$("description").value.trim(),content:$("content").value,date:new Date().toISOString(),updatedAt:new Date().toISOString(),author:"Awaneesh"}}
async function savePost(){try{if(!$("token").value)throw Error("पहले GitHub Connect करें.");const data=makeData(),oldSlug=$("oldSlug").value,path="data/posts/"+data.slug+".json";let sha=null;if(oldSlug){const old=await readPost(oldSlug);sha=old.sha}await api("/repos/"+OWNER+"/"+REPO+"/contents/"+path,{method:"PUT",body:JSON.stringify({message:(oldSlug?"Update":"Publish")+" post: "+data.slug,content:btoa(unescape(encodeURIComponent(JSON.stringify(data,null,2)+"\n"))),branch:BRANCH,...(sha?{sha}: {})})});if(oldSlug&&oldSlug!==data.slug){const old=await readPost(oldSlug);await api("/repos/"+OWNER+"/"+REPO+"/contents/data/posts/"+oldSlug+".json",{method:"DELETE",body:JSON.stringify({message:"Rename post source: "+oldSlug+" to "+data.slug,sha:old.sha,branch:BRANCH})})}msg("saveMsg","Saved. GitHub Actions अब static pages regenerate करेगा.",true);$("oldSlug").value=data.slug;await loadPosts()}catch(e){msg("saveMsg",e.message)}}
async function deletePost(name){if(!confirm("Delete "+name+"?"))return;try{const d=await api("/repos/"+OWNER+"/"+REPO+"/contents/data/posts/"+name+"?ref="+BRANCH);await api("/repos/"+OWNER+"/"+REPO+"/contents/data/posts/"+name,{method:"DELETE",body:JSON.stringify({message:"Delete post source: "+name,sha:d.sha,branch:BRANCH})});msg("saveMsg","Deleted. Static rebuild will remove the generated page.",true);newPost();await loadPosts()}catch(e){msg("saveMsg",e.message)}}
$("connect").onclick=connect;$("clearToken").onclick=()=>{sessionStorage.removeItem("fz_gh_token");$("token").value="";msg("authMsg","Token cleared.",true)};$("save").onclick=savePost;$("new").onclick=newPost;$("search").oninput=render;
if($("token").value)connect();
</script></body></html>
