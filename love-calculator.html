<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Love Calculator | FactZone</title>
    <meta name="description" content="Calculate love score compatibility between two names with FactZone Love Calculator.">
    <link rel="canonical" href="https://factzone.online/love-calculator.html">

    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "BreadcrumbList",
      "itemListElement": [
        {"@type": "ListItem", "position": 1, "name": "Home", "item": "https://factzone.online/"},
        {"@type": "ListItem", "position": 2, "name": "Tools", "item": "https://factzone.online/tools.html"},
        {"@type": "ListItem", "position": 3, "name": "Love Calculator", "item": "https://factzone.online/love-calculator.html"}
      ]
    }
    </script>

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: #f8fafc; color: #1e293b; min-height: 100vh; display: flex; flex-direction: column; }
        .main-container { width: 100%; max-width: 700px; margin: 0 auto; padding: 20px 16px; flex: 1; }
        .breadcrumbs { font-size: 13px; color: #64748b; margin-bottom: 16px; }
        .breadcrumbs a { color: #2563eb; text-decoration: none; }
        .card { background: #ffffff; border-radius: 8px; padding: 20px; border: 1px solid #e2e8f0; margin-bottom: 16px; }
        input[type="text"] { width: 100%; padding: 10px; border: 1px solid #cbd5e1; border-radius: 6px; margin: 8px 0 16px 0; outline: none; }
        .btn { background-color: #e11d48; color: white; border: none; padding: 10px 20px; border-radius: 6px; cursor: pointer; font-weight: 500; font-size: 14px; width: 100%; }
        .btn:hover { background-color: #be123c; }
        .result { margin-top: 15px; font-size: 20px; font-weight: 700; text-align: center; color: #e11d48; }
        .site-footer { background-color: #ffffff; border-top: 1px solid #e2e8f0; padding: 20px 16px; margin-top: 40px; font-size: 13px; color: #64748b; }
        .footer-inner { max-width: 700px; margin: 0 auto; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px; }
        .footer-links a { color: #475569; text-decoration: none; margin-left: 12px; }
    </style>
</head>
<body>

<div class="main-container">
    <nav class="breadcrumbs">
        <a href="https://factzone.online/">Home</a> / <a href="tools.html">Tools</a> / <strong>Love Calculator</strong>
    </nav>

    <div class="card">
        <h2>❤️ Love Calculator</h2>
        <label style="font-size: 13px; color: #64748b;">Your Name</label>
        <input type="text" id="name1" placeholder="Enter name 1">
        <label style="font-size: 13px; color: #64748b;">Partner's Name</label>
        <input type="text" id="name2" placeholder="Enter name 2">
        <button class="btn" onclick="calculateLove()">Calculate Score</button>
        <div id="loveResult" class="result"></div>
    </div>
</div>

<footer class="site-footer">
    <div class="footer-inner">
        <div>© 2026 <strong>factzone.online</strong></div>
        <div class="footer-links">
            <a href="https://factzone.online/">Home</a>
            <a href="tools.html">Tools</a>
        </div>
    </div>
</footer>

<script>
    function calculateLove() {
        const n1 = document.getElementById('name1').value.trim();
        const n2 = document.getElementById('name2').value.trim();
        if (!n1 || !n2) return alert('Please enter both names');
        const combined = (n1 + n2).toLowerCase();
        let hash = 0;
        for (let i = 0; i < combined.length; i++) hash += combined.charCodeAt(i);
        const score = (hash % 41) + 60; // Returns deterministic score between 60% and 100%
        document.getElementById('loveResult').textContent = `Compatibility: ${score}% ❤️`;
    }
</script>
</body>
</html>
