<body>
<div class="main-container">
    <nav class="breadcrumbs">
        <a href="https://factzone.online/">Home</a><span>/</span><a href="tools.html">Tools</a><span>/</span><strong>Love Calculator</strong>
    </nav>
    <main class="card">
        <div class="card-header">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#e11d48" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path>
            </svg>
            <h1>Love Calculator</h1>
        </div>

        <div class="rating-badge">★ <span id="badgeRating">4.7</span> / 5 <span id="badgeCount">(150 votes)</span></div>

        <label style="font-size: 13px; color: #64748b;">Your Name</label>
        <input type="text" id="name1" placeholder="Enter first name">
        <label style="font-size: 13px; color: #64748b;">Partner's Name</label>
        <input type="text" id="name2" placeholder="Enter second name">
        <button class="btn" onclick="calculateLove()">Calculate Score</button>
        <div id="loveResult" class="result"></div>

        <!-- Interactive Rating Widget -->
        <div class="interactive-rating">
            <p>Rate this tool (1 to 5 Stars):</p>
            <div class="stars" id="starContainer">
                <span class="star" data-value="1" title="1 Star">★</span>
                <span class="star" data-value="2" title="2 Stars">★</span>

</div>

<script>
    function calculateLove() {
        const n1 = document.getElementById('name1').value.trim();
        const n2 = document.getElementById('name2').value.trim();
        if (!n1 || !n2) return alert('Please enter both names');
        const combined = (n1 + n2).toLowerCase();
        let hash = 0;
        for (let i = 0; i < combined.length; i++) hash += combined.charCodeAt(i);
        const score = (hash % 41) + 60;
        document.getElementById('loveResult').textContent = `Compatibility: ${score}% ❤️`;
    }
</script>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, collection, getDocs, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyCUyMZee1e01RqmTmIp_0jLT7guUAc",
  authDomain: "factzone-a9ace.firebaseapp.com",
  databaseURL: "https://factzone-a9ace-default-rtdb.firebaseio.com",
  projectId: "factzone-a9ace",
  storageBucket: "factzone-a9ace.firebasestorage.app",
  messagingSenderId: "425838320650",
  appId: "1:425838320650:web:eb81baddf818cb73d3f3",
  measurementId: "G-311JQXBXRY"
};

const db = getFirestore(initializeApp(firebaseConfig));
const TOOL = "love-calculator";
const BASE_VOTES = 150;
const BASE_RATING_SUM = 150 * 4.7;

const $ = id => document.getElementById(id);

async function loadRatingsSummary(){
  try{
    const snap = await getDocs(collection(db, "toolRatings"));
    const toolRatings = snap.docs.map(d => d.data()).filter(x => x.tool === TOOL);
    
    let totalVotes = BASE_VOTES + toolRatings.length;
    let totalSum = BASE_RATING_SUM;
    toolRatings.forEach(r => totalSum += Number(r.rating || 5));
    
    let avgRating = (totalSum / totalVotes).toFixed(1);
    
    $("badgeCount").textContent = `(${totalVotes.toLocaleString()} votes)`;
    $("badgeRating").textContent = avgRating;
  }catch(e){
    console.log("Error calculating ratings summary:", e.message);
  }
}

const stars = document.querySelectorAll("#starContainer .star");
const starContainer = $("starContainer");
const savedRating = localStorage.getItem("userRated_" + TOOL);

function lockRatingUI(ratingValue, messageText) {
  stars.forEach((s, i) => {
    if (i < ratingValue) s.classList.add("active");
    else s.classList.remove("active");
    s.classList.remove("hover");
  });
  starContainer.style.pointerEvents = "none";
  starContainer.style.cursor = "default";
  const msg = $("ratingMsg");
  msg.style.display = "block";
  msg.textContent = messageText;
}

if (savedRating) {
  lockRatingUI(parseInt(savedRating, 10), `You have already rated this tool ${savedRating} / 5 stars!`);
} else {
  stars.forEach((star, idx) => {
    star.addEventListener("mouseenter", () => {
      if (localStorage.getItem("userRated_" + TOOL)) return;
      stars.forEach((s, i) => {
        if (i <= idx) s.classList.add("hover");
        else s.classList.remove("hover");
      });
    });

    star.addEventListener("mouseleave", () => {
      if (localStorage.getItem("userRated_" + TOOL)) return;
      stars.forEach(s => s.classList.remove("hover"));
    });

    star.addEventListener("click", async () => {
      if (localStorage.getItem("userRated_" + TOOL)) return;

      const selectedRating = idx + 1;
      localStorage.setItem("userRated_" + TOOL, selectedRating);
      lockRatingUI(selectedRating, `Thank you! You rated this tool ${selectedRating} / 5 stars.`);

      let currentMatch = $("badgeCount").textContent.match(/[\d,]+/);
      if(currentMatch){
        let newCount = parseInt(currentMatch[0].replace(/,/g, ''), 10) + 1;
        $("badgeCount").textContent = `(${newCount.toLocaleString()} votes)`;
      }

      try {
        await addDoc(collection(db, "toolRatings"), {
          tool: TOOL,
          rating: selectedRating,
          createdAt: serverTimestamp()
        });
        loadRatingsSummary();
      } catch (e) {
        console.error("Error saving rating to Firebase:", e.message);
      }
    });
  });
}

loadRatingsSummary();
</script>
</body>
