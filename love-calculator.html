    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: #f8fafc; color: #1e293b; min-height: 100vh; display: flex; flex-direction: column; }
        .main-container { width: 100%; max-width: 700px; margin: 0 auto; padding: 20px 16px; flex: 1; }
        .breadcrumbs { font-size: 13px; color: #64748b; margin-bottom: 16px; }
        .breadcrumbs a { color: #2563eb; text-decoration: none; }
        .breadcrumbs span { margin: 0 6px; color: #94a3b8; }
        .card { background: #ffffff; border-radius: 8px; padding: 16px; border: 1px solid #e2e8f0; margin-bottom: 16px; }
        .card-header { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
        .card-header h1 { font-size: 20px; font-weight: 700; color: #0f172a; }
        input[type="text"] { width: 100%; padding: 10px; border: 1px solid #cbd5e1; border-radius: 6px; margin: 6px 0 14px 0; outline: none; font-size: 14px; }
        .btn { background-color: #e11d48; color: white; border: none; padding: 10px 16px; border-radius: 6px; cursor: pointer; font-weight: 500; font-size: 13px; width: 100%; }

    </style>
</head>
<body>
<div class="main-container">
    <nav class="breadcrumbs">
        <a href="https://factzone.online/">Home</a><span>/</span><a href="tools.html">Tools</a><span>/</span><strong>Love Calculator</strong>
    </nav>
    <main class="card">
        <div class="card-header">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#e11d48" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path>
            </svg>
            <h1>Love Calculator</h1>
        </div>
        <label style="font-size: 13px; color: #64748b;">Your Name</label>
        <input type="text" id="name1" placeholder="Enter first name">
        <label style="font-size: 13px; color: #64748b;">Partner's Name</label>
        <input type="text" id="name2" placeholder="Enter second name">
        <button class="btn" onclick="calculateLove()">Calculate Score</button>
        <div id="loveResult" class="result"></div>
    </main>
</div>
<footer class="site-footer">
    <div class="footer-inner">
        <div>© 2026 <strong>factzone.online</strong>. All rights reserved.</div>
        <div class="footer-links">
            <a href="https://factzone.online/">Home</a>
            <a href="tools.html">Tools</a>
        </div>
    </div>
</footer>
<script>
    function calculateLove() {
        const n1 = document.getElementById('name1').value.trim();
        const n2 = document.getElementById('name2').value.trim();
        if (!n1 || !n2) return alert('Please enter both names');
        const combined = (n1 + n2).toLowerCase();
        let hash = 0;
        for (let i = 0; i < combined.length; i++) hash += combined.charCodeAt(i);
        const score = (hash % 41) + 60;
        document.getElementById('loveResult').textContent = `Compatibility: ${score}% ❤️`;
    }
</script>
</body>
