  <script>
    const toggleBtn = document.getElementById('themeToggle');

    function toggleTheme() {
      if (document.documentElement.classList.contains('dark')) {
        document.documentElement.classList.remove('dark');
        localStorage.setItem('theme', 'light');
      } else {
        document.documentElement.classList.add('dark');
        localStorage.setItem('theme', 'dark');
      }
    }

    toggleBtn.addEventListener('click', toggleTheme);

    const scrollArea = document.getElementById('filterScrollArea');
    let isDown = false;
    let startX;
    let scrollLeftStart;
    let dragged = false;

    scrollArea.addEventListener('mousedown', (e) => {
      isDown = true;
      dragged = false;
      startX = e.pageX - scrollArea.offsetLeft;
      scrollLeftStart = scrollArea.scrollLeft;
    });
    window.addEventListener('mouseup', () => { isDown = false; });
    scrollArea.addEventListener('mouseleave', () => { isDown = false; });
    scrollArea.addEventListener('mousemove', (e) => {
      if (!isDown) return;
      e.preventDefault();
      const x = e.pageX - scrollArea.offsetLeft;
      const walk = x - startX;
      if (Math.abs(walk) > 5) dragged = true;
      scrollArea.scrollLeft = scrollLeftStart - walk;
    });
    scrollArea.addEventListener('click', (e) => {
      if (dragged) { e.stopPropagation(); e.preventDefault(); }
    }, true);

    scrollArea.addEventListener('wheel', (e) => {
      if (e.deltaY === 0) return;
      e.preventDefault();
      scrollArea.scrollLeft += e.deltaY;
    }, { passive: false });
  </script>

  <script>
    const FIRESTORE_PROJECT_ID = "factzone-a9ace";
    const FIRESTORE_QUERY_URL = `https://firestore.googleapis.com/v1/projects/${FIRESTORE_PROJECT_ID}/databases/(default)/documents:runQuery`;

    const postsContainer = document.getElementById("posts");
    let selectedCategory = "all";

    const CACHE_KEY = "factzone_posts_v6";

    function escapeHtml(str) {
      return String(str == null ? "" : str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#39;");
    }

    function filterPosts() {
      const searchValue = document.getElementById("searchInput").value.toLowerCase();

      document.querySelectorAll("#posts a").forEach(card => {
        const cardText = card.innerText.toLowerCase();
        const matchesSearch = cardText.includes(searchValue);
        const cardCategory = card.dataset.category || "";
        const matchesCategory = (selectedCategory === "all") || (cardCategory === selectedCategory);

        card.style.display = (matchesSearch && matchesCategory) ? "flex" : "none";
      });
    }

    function parseFirestoreValue(value) {
      if (!value) return null;
      if (value.stringValue !== undefined) return value.stringValue;
      if (value.integerValue !== undefined) return parseInt(value.integerValue, 10);
      if (value.doubleValue !== undefined) return value.doubleValue;
      if (value.booleanValue !== undefined) return value.booleanValue;
      if (value.timestampValue !== undefined) return value.timestampValue;
      if (value.nullValue !== undefined) return null;
      if (value.mapValue !== undefined) return parseFirestoreFields(value.mapValue.fields || {});
      if (value.arrayValue !== undefined) return (value.arrayValue.values || []).map(parseFirestoreValue);
      return null;
    }

    function parseFirestoreFields(fields) {
      const obj = {};
      for (const key in fields) {
        obj[key] = parseFirestoreValue(fields[key]);
      }
      return obj;
    }

    function parseDate(val) {
      if (!val) return new Date(0);
      if (typeof val === 'string') return new Date(val);
      if (val.seconds) return new Date(val.seconds * 1000);
      return new Date(val);
    }

    async function loadPosts(){
      const cachedPosts = localStorage.getItem(CACHE_KEY);
      if(cachedPosts){
        postsContainer.innerHTML = cachedPosts;
        filterPosts();
      }

      try {
        const requestBody = {
          structuredQuery: {
            from: [{ collectionId: "posts" }],
            orderBy: [{ field: { fieldPath: "createdAt" }, direction: "DESCENDING" }]
          }
        };

        const response = await fetch(FIRESTORE_QUERY_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(requestBody)
        });

        if (!response.ok) {
          throw new Error(`Firestore REST query failed: ${response.status}`);
        }

        const results = await response.json();

        let postsArray = [];
        (Array.isArray(results) ? results : []).forEach((item) => {
          if (!item.document) return;
          const docName = item.document.name;
          const id = docName.substring(docName.lastIndexOf("/") + 1);
          const data = parseFirestoreFields(item.document.fields || {});
          postsArray.push({ id, ...data });
        });

        postsArray.sort((a, b) => parseDate(b.createdAt) - parseDate(a.createdAt));

        if (postsArray.length === 0) {
          if (!cachedPosts) {
            postsContainer.innerHTML = `<h2 class="text-center text-xl col-span-full dark:text-white">No Posts Found</h2>`;
          }
          return;
        }

        let htmlContent = "";
        postsArray.forEach((post)=>{
          const safeTitle    = escapeHtml(post.title || 'FactZone Post');
          const safeImage    = escapeHtml(post.image || 'https://via.placeholder.com/300x150');
          const safeDesc     = escapeHtml(post.desc || '');
          const safeId       = encodeURIComponent(post.id);
          const safeCategory = escapeHtml(post.category || '');
          
          const descHtml = safeDesc 
            ? `<p class="text-gray-500 dark:text-gray-400 text-xs line-clamp-3 opacity-80 mt-1">${safeDesc}</p>` 
            : '';

          htmlContent += `
          <a href="detail.html?id=${safeId}" class="card" data-category="${safeCategory}">
            <div class="post-image-container">
              <img src="${safeImage}" alt="${safeTitle}" class="post-image" loading="lazy" width="300" height="110">
            </div>
            <div class="p-2.5 flex flex-col flex-1">
              <h2 class="font-bold text-xs sm:text-sm text-gray-900 dark:text-white leading-snug">${safeTitle}</h2>
              ${descHtml}
            </div>
          </a>`;
        });

        postsContainer.innerHTML = htmlContent;
        localStorage.setItem(CACHE_KEY, htmlContent);
        filterPosts();

      } catch (error) {
        console.error("Error fetching data:", error);
      }
    }

    loadPosts();

    document.getElementById("searchInput").addEventListener("input", filterPosts);

    document.querySelectorAll(".filter-tab").forEach(tab => {
      tab.addEventListener("click", () => {
        document.querySelectorAll(".filter-tab").forEach(t => {
          t.classList.remove("active-tab");
          t.classList.remove("text-white");
          t.classList.add("text-gray-300");
        });
        tab.classList.add("active-tab");
        tab.classList.remove("text-gray-300");
        tab.classList.add("text-white");
        selectedCategory = tab.dataset.value;
        filterPosts();
      });
    });
  </script>
