<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instagram Carousel Idea Generator</title>
    <meta name="description" content="Generate high-converting Instagram carousel ideas and slide-by-slide copy in seconds.">
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --primary: #833ab4;
            --secondary: #fd1d1d;
            --accent: #fcb045;
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-color: #f8fafc;
            --muted-color: #94a3b8;
            --border-color: #334155;
            --radius: 12px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
            padding: 2rem 1rem;
            display: flex;
            justify-content: center;
        }

        .container {
            max-width: 900px;
            width: 100%;
        }

        header {
            text-align: center;
            margin-bottom: 2.5rem;
        }

        .gradient-text {
            background: linear-gradient(45deg, var(--primary), var(--secondary), var(--accent));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-size: 2.5rem;
            font-weight: 800;
            margin-bottom: 0.5rem;
        }

        p.subtitle {
            color: var(--muted-color);
            font-size: 1rem;
        }

        .card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: var(--radius);
            padding: 1.5rem;
            margin-bottom: 2rem;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
        }

        .form-group {
            margin-bottom: 1.25rem;
        }

        label {
            display: block;
            font-weight: 600;
            margin-bottom: 0.5rem;
            font-size: 0.9rem;
            color: #cbd5e1;
        }

        input, select {
            width: 100%;
            padding: 0.8rem 1rem;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            background-color: #0f172a;
            color: var(--text-color);
            font-size: 0.95rem;
            outline: none;
            transition: border-color 0.2s;
        }

        input:focus, select:focus {
            border-color: var(--primary);
        }

        .btn-generate {
            width: 100%;
            padding: 0.9rem;
            border: none;
            border-radius: 8px;
            background: linear-gradient(45deg, var(--primary), var(--secondary));
            color: white;
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            transition: opacity 0.2s, transform 0.1s;
        }

        .btn-generate:hover {
            opacity: 0.95;
        }

        .btn-generate:active {
            transform: scale(0.99);
        }

        .results-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
        }

        .btn-copy {
            background: transparent;
            border: 1px solid var(--border-color);
            color: var(--text-color);
            padding: 0.5rem 1rem;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: 600;
            transition: background 0.2s;
        }

        .btn-copy:hover {
            background: #334155;
        }

        .slides-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 1rem;
        }

        .slide-card {
            background: #0f172a;
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 1.25rem;
            position: relative;
            display: flex;
            flex-direction: column;
        }

        .slide-number {
            font-size: 0.75rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--accent);
            margin-bottom: 0.5rem;
        }

        .slide-title {
            font-weight: 700;
            font-size: 1rem;
            margin-bottom: 0.5rem;
            color: #f1f5f9;
        }

        .slide-body {
            font-size: 0.875rem;
            color: var(--muted-color);
            line-height: 1.5;
            flex-grow: 1;
        }

        .slide-tag {
            display: inline-block;
            margin-top: 0.75rem;
            font-size: 0.7rem;
            padding: 0.25rem 0.5rem;
            background: rgba(131, 58, 180, 0.2);
            color: #c084fc;
            border-radius: 4px;
            width: fit-content;
        }

        .hidden {
            display: none;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1 class="gradient-text">Carousel Idea Generator</h1>
        <p class="subtitle">Turn any topic into an engaging 5-to-7 slide Instagram carousel structure.</p>
    </header>

    <div class="card">
        <div class="form-group">
            <label for="topic">Niche or Topic</label>
            <input type="text" id="topic" placeholder="e.g., Web Development, Weight Loss, Personal Finance">
        </div>

        <div class="form-group">
            <label for="goal">Carousel Goal</label>
            <select id="goal">
                <option value="educational">Educational / How-To</option>
                <option value="mistakes">Common Mistakes & Solutions</option>
                <option value="tools">Resource / Tool List</option>
                <option value="growth">Mindset & Growth Shift</option>
            </select>
        </div>

        <button class="btn-generate" onclick="generateCarousel()">Generate Ideas</button>
    </div>

    <div id="resultsContainer" class="hidden">
        <div class="results-header">
            <h2 style="font-size: 1.25rem;">Suggested Slide Outline</h2>
            <button class="btn-copy" onclick="copyToClipboard()">Copy Outline</button>
        </div>

        <div class="slides-grid" id="slidesGrid"></div>
    </div>
</div>

<script>
    const templates = {
        educational: [
            { type: "HOOK", title: "How to Master [Topic]", desc: "The step-by-step framework most people ignore. (Swipe ->)" },
            { type: "THE PROBLEM", title: "Why Most People Fail", desc: "They focus on complex tools before mastering the core basics of [Topic]." },
            { type: "STEP 1", title: "Foundation First", desc: "Start with simple daily routines. Build consistency before scaling." },
            { type: "STEP 2", title: "Optimize Process", desc: "Eliminate low-value steps. Focus only on high-impact actions." },
            { type: "STEP 3", title: "Track Progress", desc: "Measure weekly output rather than chasing immediate results." },
            { type: "SUMMARY", title: "Quick Recap", desc: "1. Build foundation\n2. Optimize workflow\n3. Track weekly growth" },
            { type: "CTA", title: "Save This Post!", desc: "Found this helpful? Double tap and save it for your next project." }
        ],
        mistakes: [
            { type: "HOOK", title: "5 [Topic] Mistakes", desc: "Stop making mistake #3 if you want long-term success!" },
            { type: "MISTAKE 1", title: "Ignoring Fundamentals", desc: "Jumping directly into advanced strategies without strong basics." },
            { type: "MISTAKE 2", title: "Lack of Consistency", desc: "Expecting massive returns without putting in daily effort." },
            { type: "MISTAKE 3", title: "Over-complicating Tools", desc: "Spending weeks setting up systems instead of taking action." },
            { type: "THE FIX", title: "What to Do Instead", desc: "Simplify your strategy down to one clear daily task." },
            { type: "CTA", title: "Share With a Friend", desc: "Tag someone who needs to hear this today!" }
        ],
        tools: [
            { type: "HOOK", title: "Top Tools for [Topic]", desc: "These tools feel like cheat codes in 2026." },
            { type: "TOOL 1", title: "The Efficiency Booster", desc: "Automates repetitive workflows so you save 5+ hours weekly." },
            { type: "TOOL 2", title: "The Analytics Tracker", desc: "Gives clear metrics on what is actually bringing results." },
            { type: "TOOL 3", title: "The Creator Essential", desc: "Simplifies design and content creation effortlessly." },
            { type: "PRO TIP", title: "How to Combine Them", desc: "Integrate these three to build an automated, scalable workflow." },
            { type: "CTA", title: "Comment 'TOOL'", desc: "Comment 'TOOL' below and I will send you the direct links!" }
        ],
        growth: [
            { type: "HOOK", title: "Shift Your [Topic] Mindset", desc: "How changing one belief changed all my results." },
            { type: "OLD WAY", title: "The Old Mindset", desc: "Thinking you need perfection before launch or execution." },
            { type: "NEW WAY", title: "The New Mindset", desc: "Iterating in public and treating every failure as feedback." },
            { type: "KEY LESSON", title: "The 1% Rule", desc: "Small daily improvements compound into massive yearly transformations." },
            { type: "CTA", title: "Follow for More", desc: "Follow for weekly tips and strategies on mastering [Topic]." }
        ]
    };

    function generateCarousel() {
        const topicInput = document.getElementById('topic').value.trim() || 'Your Niche';
        const goalSelect = document.getElementById('goal').value;
        const slidesGrid = document.getElementById('slidesGrid');
        const resultsContainer = document.getElementById('resultsContainer');

        slidesGrid.innerHTML = '';
        const selectedOutline = templates[goalSelect];

        selectedOutline.forEach((slide, index) => {
            const slideTitle = slide.title.replace(/\[Topic\]/g, topicInput);
            const slideDesc = slide.desc.replace(/\[Topic\]/g, topicInput);

            const slideCard = document.createElement('div');
            slideCard.className = 'slide-card';
            slideCard.innerHTML = `
                <div class="slide-number">Slide ${index + 1}</div>
                <div class="slide-title">${slideTitle}</div>
                <div class="slide-body">${slideDesc.replace(/\n/g, '<br>')}</div>
                <span class="slide-tag">${slide.type}</span>
            `;
            slidesGrid.appendChild(slideCard);
        });

        resultsContainer.classList.remove('hidden');
    }

    function copyToClipboard() {
        const slides = document.querySelectorAll('.slide-card');
        let text = "INSTAGRAM CAROUSEL OUTLINE:\n\n";

        slides.forEach((slide) => {
            const num = slide.querySelector('.slide-number').innerText;
            const title = slide.querySelector('.slide-title').innerText;
            const body = slide.querySelector('.slide-body').innerText;
            text += `${num}: ${title}\n${body}\n\n`;
        });

        navigator.clipboard.writeText(text).then(() => {
            alert('Carousel outline copied to clipboard!');
        });
    }
</script>

</body>
</html>
