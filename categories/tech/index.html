<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>{{CATEGORY_LABEL}} Facts &amp; Articles | FactZone</title>
  <meta name="description" content="{{META_DESCRIPTION}}">
  <meta name="robots" content="index,follow,max-image-preview:large,max-snippet:-1,max-video-preview:-1">
  <meta name="theme-color" content="#111827">
  <link rel="canonical" href="{{CANONICAL_URL}}">
  <link rel="sitemap" type="application/xml" href="https://factzone.online/sitemap.xml">

  <meta property="og:type"        content="website">
  <meta property="og:site_name"   content="FactZone">
  <meta property="og:locale"      content="hi_IN">
  <meta property="og:title"       content="{{CATEGORY_LABEL}} Facts & Articles | FactZone">
  <meta property="og:description" content="{{META_DESCRIPTION}}">
  <meta property="og:image"       content="https://factzone.online/logo.png">
  <meta property="og:url"         content="{{CANONICAL_URL}}">

  <!-- CollectionPage + Breadcrumb JSON-LD (generated at build time) -->
  <script type="application/ld+json">
{{JSONLD}}
  </script>

  <link rel="icon" href="https://factzone.online/logo.png" sizes="48x48" type="image/png">
  <link rel="apple-touch-icon" href="https://factzone.online/logo.png">
  <link rel="manifest" href="/manifest.json">

  <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Merriweather:wght@400;700&family=DM+Sans:wght@400;500;700&display=swap" onload="this.onload=null;this.rel='stylesheet'">
  <noscript><link href="https://fonts.googleapis.com/css2?family=Merriweather:wght@400;700&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet"></noscript>

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root { --bg:#f4f4f2; --surface:#ffffff; --ink:#111827; --muted:#6b7280; --accent:#c0392b; --border:#e5e7eb; --r:0.75rem; }
    body { background: var(--bg); font-family: 'DM Sans', sans-serif; color: var(--ink); line-height: 1.45; }
    .wrap { max-width: 960px; margin: 0 auto; padding: 0.4rem 0.75rem 1.5rem; }
    .site-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 0.5rem; padding-bottom: 0.4rem; border-bottom: 2px solid var(--ink); }
    .logo-link { display: flex; align-items: center; gap: 0.4rem; text-decoration: none; color: inherit; }
    .logo-link img { width: 28px; height: 28px; border-radius: 50%; background: #fff; padding: 2px; box-shadow: 0 1px 4px rgba(0,0,0,.1); }
    .logo-link span { font-family: 'Merriweather', serif; font-size: 1.05rem; font-weight: 700; letter-spacing: -.02em; }
    .back-btn { background: var(--ink); color: #fff; text-decoration: none; font-weight: 700; font-size: 0.78rem; padding: 0.35rem 0.8rem; border-radius: 0.4rem; }
    .visual-breadcrumb { font-size: 0.78rem; color: var(--muted); margin: 0.6rem 0; display: flex; align-items: center; gap: 0.35rem; flex-wrap: wrap; }
    .visual-breadcrumb a { color: var(--muted); text-decoration: none; font-weight: 500; }
    .visual-breadcrumb a:hover { color: var(--accent); text-decoration: underline; }
    .visual-breadcrumb span.sep { color: #9ca3af; }
    .page-title { font-family: 'Merriweather', serif; font-size: clamp(1.4rem, 4vw, 2rem); font-weight: 700; margin-bottom: 0.3rem; }
    .page-sub { color: var(--muted); font-size: 0.9rem; margin-bottom: 1rem; }
    .post-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 0.85rem; }
    .post-card { display: flex; flex-direction: column; background: var(--surface); border: 1px solid var(--border); border-radius: var(--r); overflow: hidden; text-decoration: none; color: inherit; box-shadow: 0 2px 12px rgba(0,0,0,.05); }
    .post-card img { width: 100%; aspect-ratio: 16/9; object-fit: cover; background: var(--bg); }
    .post-card .body { padding: 0.7rem 0.8rem 0.85rem; display: flex; flex-direction: column; gap: 0.3rem; flex: 1; }
    .post-card .title { font-weight: 700; font-size: 0.95rem; line-height: 1.3; }
    .post-card .desc { font-size: 0.82rem; color: var(--muted); line-height: 1.4; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .post-card .date { font-size: 0.72rem; color: #9ca3af; margin-top: auto; }
    .empty { color: var(--muted); padding: 1.5rem; text-align: center; }
    .site-footer { margin-top: 1.5rem; padding-top: 0.75rem; border-top: 1px solid var(--border); text-align: center; }
    .footer-links { display: flex; flex-wrap: wrap; justify-content: center; gap: 0.75rem; margin-bottom: 0.4rem; }
    .footer-links a { color: var(--muted); text-decoration: none; font-size: 0.8rem; font-weight: 600; }
    .footer-copy { font-size: 0.75rem; color: var(--muted); }
  </style>
</head>
<body>
<div class="wrap">
  <header class="site-header">
    <a href="/" class="logo-link" aria-label="FactZone Home">
      <img src="https://factzone.online/logo.png" alt="FactZone Logo" width="44" height="44">
      <span>FactZone</span>
    </a>
    <a href="/" class="back-btn">← Back</a>
  </header>

  <nav class="visual-breadcrumb" aria-label="Breadcrumb">
    <a href="/">Home</a><span class="sep">›</span>
    <span>{{CATEGORY_LABEL}}</span>
  </nav>

  <h1 class="page-title">{{CATEGORY_LABEL}}</h1>
  <p class="page-sub">{{POST_COUNT}} articles in this category</p>

  <div class="post-grid">
{{POST_CARDS_HTML}}
  </div>

  <footer class="site-footer">
    <nav class="footer-links" aria-label="Footer">
      <a href="/about.html">About</a>
      <a href="/contact.html">Contact</a>
      <a href="/privacy.html">Privacy</a>
      <a href="/terms.html">Terms</a>
      <a href="/disclaimer.html">Disclaimer</a>
      <a href="/tools.html">Tools</a>
    </nav>
    <p class="footer-copy">© 2026 FactZone. All rights reserved.</p>
  </footer>
</div>
</body>
</html>
