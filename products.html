    <style>
        :root {
            --bg-body: #ffffff; --bg-card: #f8fafc; --text-main: #0f172a; --text-muted: #64748b;
            --primary: #0284c7; --primary-hover: #0369a1; --border: #e2e8f0; --price: #16a34a;
        }
        [data-theme="dark"] {
            --bg-body: #0f172a; --bg-card: #1e293b; --text-main: #f8fafc; --text-muted: #94a3b8;
            --primary: #38bdf8; --primary-hover: #0284c7; --border: #334155; --price: #22c55e;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: system-ui, sans-serif; }
        body { background-color: var(--bg-body); color: var(--text-main); line-height: 1.5; }

        header { background-color: var(--bg-card); border-bottom: 1px solid var(--border); padding: 0.75rem 1.25rem; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 1000; }
        .logo { font-size: 1.3rem; font-weight: 700; color: var(--primary); text-decoration: none; }
        .nav-right { display: flex; align-items: center; gap: 1rem; flex-wrap: wrap; }
        .nav-links a { color: var(--text-main); text-decoration: none; font-weight: 500; font-size: 0.9rem; margin-right: 0.8rem; }
        .lang-select, .theme-toggle { background: var(--bg-body); border: 1px solid var(--border); color: var(--text-main); padding: 0.3rem 0.5rem; border-radius: 6px; font-size: 0.85rem; cursor: pointer; }

        .breadcrumb { max-width: 1200px; margin: 0.6rem auto 0; padding: 0 1rem; font-size: 0.8rem; color: var(--text-muted); }
        .breadcrumb a { color: var(--primary); text-decoration: none; }

        .hero { text-align: center; padding: 1rem 1rem 0.4rem; max-width: 800px; margin: 0 auto; }
        .hero h1 { font-size: 1.4rem; margin-bottom: 0.2rem; font-weight: 700; }
        .hero p { color: var(--text-muted); font-size: 0.85rem; }

        .container { max-width: 1200px; margin: 0 auto; padding: 0.8rem 1rem 1.5rem; }

        .toolbar { display: flex; gap: 0.6rem; flex-wrap: wrap; margin-bottom: 1.2rem; }
        .toolbar input, .toolbar select { padding: 0.55rem 0.7rem; border: 1px solid var(--border); border-radius: 8px; background: var(--bg-body); color: var(--text-main); font-size: 0.85rem; }
        .toolbar input { flex: 1; min-width: 200px; }

        .product-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 1.25rem; }
        .product-card { background-color: var(--bg-card); border: 1px solid var(--border); border-radius: 10px; padding: 1.1rem; display: flex; flex-direction: column; justify-content: space-between; }
        .card-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 0.6rem; }
        .icon-box { font-size: 1.8rem; }
        .preview-thumb { width: 100%; max-height: 140px; object-fit: cover; border-radius: 8px; margin-bottom: 0.6rem; cursor: pointer; }
        .tag { background-color: rgba(2, 132, 199, 0.1); color: var(--primary); font-size: 0.75rem; padding: 0.15rem 0.5rem; border-radius: 4px; font-weight: 600; }
        .product-title { font-size: 1.1rem; font-weight: 600; margin-bottom: 0.2rem; }
        .product-desc { color: var(--text-muted); font-size: 0.85rem; margin-bottom: 0.5rem; }
        .rating-line { font-size: 0.78rem; color: #eab308; margin-bottom: 0.6rem; }
        .rating-line .count { color: var(--text-muted); }
        .review-link { font-size: 0.75rem; color: var(--primary); background: none; border: none; cursor: pointer; padding: 0; text-decoration: underline; }

        .card-bottom { display: flex; align-items: center; justify-content: space-between; border-top: 1px solid var(--border); padding-top: 0.8rem; gap: 0.5rem; flex-wrap: wrap; }
        .price { font-size: 1.25rem; font-weight: 700; color: var(--price); }
        .price .strike { text-decoration: line-through; color: var(--text-muted); font-size: 0.85rem; font-weight: 500; margin-right: 0.3rem; }

        .status-badge { font-size: 0.72rem; font-weight: 600; padding: 0.25rem 0.45rem; border-radius: 6px; text-align: center; white-space: nowrap; }
        .badge-info { background: rgba(2, 132, 199, 0.1); color: var(--primary); border: 1px solid rgba(2, 132, 199, 0.2); }
        .badge-pending { background: #fef08a; color: #854d0e; border: 1px solid #fde047; }
        .badge-approved { background: #dcfce7; color: #166534; border: 1px solid #86efac; }
        .badge-expired { background: #fee2e2; color: #991b1b; border: 1px solid #fecaca; }

        .download-btn { background-color: var(--primary); color: #ffffff; border: none; padding: 0.45rem 0.9rem; border-radius: 6px; font-size: 0.85rem; font-weight: 600; cursor: pointer; transition: 0.2s; text-decoration:none; display:inline-block; }
        .download-btn:hover { background-color: var(--primary-hover); }
        .btn-approved-red { background-color: #ef4444 !important; color: #ffffff !important; animation: pulse 1.5s infinite; }
        .btn-approved-red:hover { background-color: #dc2626 !important; }
        .download-btn-disabled { background-color: #94a3b8 !important; cursor: not-allowed; }
        @keyframes pulse { 0% { transform: scale(1);} 50% { transform: scale(1.03);} 100% { transform: scale(1);} }

        .empty-state, .loading-state { grid-column: 1 / -1; text-align: center; padding: 3rem 1rem; color: var(--text-muted); }
        .empty-state .icon-box, .loading-state .icon-box { font-size: 2.5rem; display: block; margin-bottom: 0.5rem; }

        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); display: none; justify-content: center; align-items: center; z-index: 2000; padding: 1rem; }
        .modal { background: var(--bg-body); border-radius: 12px; padding: 1.5rem; max-width: 380px; width: 100%; text-align: center; border: 1px solid var(--border); position: relative; max-height: 90vh; overflow-y: auto; }
        .modal-close { position: absolute; top: 10px; right: 15px; background: none; border: none; font-size: 1.2rem; cursor: pointer; color: var(--text-main); }
        .qr-img { width: 180px; height: 180px; margin: 0.8rem auto; border-radius: 8px; border: 1px solid var(--border); object-fit: contain; background: #fff; }
        .upi-id { background: var(--bg-card); padding: 0.4rem; border-radius: 6px; font-weight: 600; font-size: 0.85rem; margin-bottom: 0.8rem; word-break: break-all; }
        .form-input { width: 100%; padding: 0.5rem; border: 1px solid var(--border); border-radius: 6px; margin-bottom: 0.6rem; font-size: 0.85rem; background: var(--bg-body); color: var(--text-main); }
        .coupon-row { display: flex; gap: 0.4rem; }
        .coupon-row .form-input { margin-bottom: 0; }
        .coupon-row button { white-space: nowrap; }
        .coupon-msg { font-size: 0.75rem; margin: 0.35rem 0 0.6rem; text-align: left; }
        .coupon-msg.ok { color: #16a34a; }
        .coupon-msg.err { color: #ef4444; }
        .field-error { color: #ef4444; font-size: 0.75rem; text-align: left; margin: -0.4rem 0 0.6rem; display: none; }
        .verify-btn { background: var(--price); color: white; border: none; width: 100%; padding: 0.6rem; border-radius: 6px; font-weight: 600; cursor: pointer; }
        .verify-btn:disabled { opacity: 0.6; cursor: not-allowed; }
        .star-input { font-size: 1.6rem; letter-spacing: 0.2rem; cursor: pointer; margin-bottom: 0.6rem; }
        .star-input span { color: #cbd5e1; }
        .star-input span.active { color: #eab308; }
        .review-item { text-align: left; border-top: 1px solid var(--border); padding-top: 0.5rem; margin-top: 0.5rem; font-size: 0.8rem; }
        .review-item .stars { color: #eab308; }

        footer { text-align: center; padding: 1.5rem 1rem; border-top: 1px solid var(--border); margin-top: 2rem; color: var(--text-muted); font-size: 0.8rem; }
    </style>
</head>

            <select class="lang-select" id="langSelector" onchange="changeLanguage(this.value)" aria-label="Language">

    <footer>

    <script>
        // ---------------------------------------------------------------
        // FIREBASE INIT
        // ---------------------------------------------------------------
        const firebaseConfig = {
            apiKey: "AIzaSyCUyQyMzEee1eO1RqmhTmIp_OjLT7guUAc",
            authDomain: "factzone-a9ace.firebaseapp.com",
            databaseURL: "https://factzone-a9ace-default-rtdb.firebaseio.com",
            projectId: "factzone-a9ace",
            storageBucket: "factzone-a9ace.firebasestorage.app",
            messagingSenderId: "425838320650",
            appId: "1:425838320650:web:beab18baddf818cb73d3f3",
            measurementId: "G-311JQXBXR9"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        // Approved downloads stop working after this many hours (security).
        // Admin can override this from the admin panel's UPI settings card.
        const DEFAULT_EXPIRY_HOURS = 48;

        const translations = {
            en: { tools: "Tools", store: "Store", heroTitle: "Digital Products Store", heroDesc: "Premium eBooks, Canva Templates, and Source Codes for Instant Download", btnText: "Download", empty: "No products available right now. Please check back soon.", loading: "Loading products..." },
            hi: { tools: "टूल्स", store: "स्टोर", heroTitle: "डिजिटल प्रोडक्ट्स स्टोर", heroDesc: "प्रीमियम ई-बुक्स, कैनवा टेम्पलेट्स और सोर्स कोड्स तुरंत डाउनलोड करें", btnText: "डाउनलोड", empty: "अभी कोई प्रोडक्ट उपलब्ध नहीं है। कृपया बाद में देखें।", loading: "प्रोडक्ट्स लोड हो रहे हैं..." }
        };

        let currentLang = localStorage.getItem('fz_lang') || 'en';
        let activeProduct = null;
        let activeReviewProductId = null;
        let selectedStars = 0;
        let appliedCoupon = null; // { code, type, value }

        let allProducts = [];
        let reviewsByProduct = {}; // productId -> [ {rating, name, text} ]
        let upiSettings = { upiId: '', qrUrl: '', adminWhatsapp: '', expiryHours: DEFAULT_EXPIRY_HOURS };
        let myOrders = JSON.parse(localStorage.getItem('fz_my_orders') || '[]'); // [{orderId, productId}]
        let myOrderStatus = {}; // productId -> order data (from Firestore, fetched by id)

        function escapeHtml(str) {
            return String(str ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
        }

        function changeLanguage(lang) {
            currentLang = lang;
            localStorage.setItem('fz_lang', lang);
            document.getElementById('langSelector').value = lang;
            document.getElementById('navTools').innerText = translations[lang].tools;
            document.getElementById('navStore').innerText = translations[lang].store;
            document.getElementById('breadcrumbCurrent').innerText = translations[lang].store;
            document.getElementById('heroTitle').innerText = translations[lang].heroTitle;
            document.getElementById('heroDesc').innerText = translations[lang].heroDesc;
            document.title = translations[lang].heroTitle + ' - FactZone';
            renderProducts();
        }

        // ---------------------------------------------------------------
        // LIVE DATA — Firestore keeps this page in sync automatically,
        // across every visitor's tab, without any manual refresh.
        // ---------------------------------------------------------------
        db.collection('products').orderBy('createdAt', 'desc').onSnapshot(snap => {
            allProducts = snap.docs.map(d => ({ id: d.id, ...d.data() }));
            populateCategoryFilter();
            refreshMyOrderStatuses().then(renderProducts);
        }, err => {
            console.error('Products listener error:', err);
            document.getElementById('productGrid').innerHTML =
                `<div class="empty-state"><span class="icon-box">⚠️</span><p>Could not load products. Please refresh the page.</p></div>`;
        });

        db.collection('reviews').onSnapshot(snap => {
            reviewsByProduct = {};
            snap.docs.forEach(d => {
                const r = d.data();
                if (!reviewsByProduct[r.productId]) reviewsByProduct[r.productId] = [];
                reviewsByProduct[r.productId].push(r);
            });
            renderProducts();
        }, err => console.error('Reviews listener error:', err));

        db.collection('settings').doc('store').onSnapshot(snap => {
            if (snap.exists) {
                upiSettings = { upiId: '', qrUrl: '', adminWhatsapp: '', expiryHours: DEFAULT_EXPIRY_HOURS, ...snap.data() };
            }
        }, err => console.error('Settings listener error:', err));

        function populateCategoryFilter() {
            const select = document.getElementById('categoryFilter');
            const current = select.value;
            const tags = [...new Set(allProducts.map(p => p.tag).filter(Boolean))].sort();
            select.innerHTML = '<option value="">All Categories</option>' +
                tags.map(t => `<option value="${escapeHtml(t)}">${escapeHtml(t)}</option>`).join('');
            if (tags.includes(current)) select.value = current;
        }

        // Because non-admins can only "get" an order by its known ID (not
        // list the whole collection — see firestore.rules), we look up each
        // order we personally created, one by one, to know its status.
        async function refreshMyOrderStatuses() {
            myOrderStatus = {};
            for (const entry of myOrders) {
                try {
                    const doc = await db.collection('orders').doc(entry.orderId).get();
                    if (doc.exists) myOrderStatus[entry.productId] = { id: doc.id, ...doc.data() };
                } catch (e) {
                    console.error('Could not refresh order status:', e);
                }
            }
        }

        function avgRating(productId) {
            const list = reviewsByProduct[productId] || [];
            if (!list.length) return null;
            const sum = list.reduce((a, r) => a + Number(r.rating || 0), 0);
            return { avg: (sum / list.length).toFixed(1), count: list.length };
        }

        function renderProducts() {
            const grid = document.getElementById('productGrid');
            const search = (document.getElementById('searchInput').value || '').toLowerCase().trim();
            const category = document.getElementById('categoryFilter').value;

            const filtered = allProducts.filter(p => {
                const matchesSearch = !search || (p.title || '').toLowerCase().includes(search) || (p.desc || '').toLowerCase().includes(search);
                const matchesCategory = !category || p.tag === category;
                return matchesSearch && matchesCategory;
            });

            if (!allProducts.length) {
                grid.innerHTML = `<div class="empty-state"><span class="icon-box">🛒</span><p>${escapeHtml(translations[currentLang].empty)}</p></div>`;
                injectProductSchema([]);
                return;
            }
            if (!filtered.length) {
                grid.innerHTML = `<div class="empty-state"><span class="icon-box">🔍</span><p>No products match your search.</p></div>`;
                return;
            }

            grid.innerHTML = filtered.map(p => {
                const order = myOrderStatus[p.id];
                const rating = avgRating(p.id);

                let badgeHTML = `<span class="status-badge badge-info">Approve in 24 hrs</span>`;
                let buttonHTML = `<button class="download-btn" onclick="handleProductClick('${p.id}')">${translations[currentLang].btnText}</button>`;

                if (order) {
                    if (order.status === 'Approved') {
                        const approvedAt = order.approvedAt ? order.approvedAt.toMillis() : null;
                        const expiryHrs = Number(upiSettings.expiryHours) || DEFAULT_EXPIRY_HOURS;
                        const expired = approvedAt ? (Date.now() - approvedAt) > expiryHrs * 3600 * 1000 : false;

                        if (expired) {
                            badgeHTML = `<span class="status-badge badge-expired">⏱ Expired</span>`;
                            buttonHTML = `<button class="download-btn download-btn-disabled" onclick="alert('This download link has expired for security. Please contact the seller for help.')">Link Expired</button>`;
                        } else {
                            badgeHTML = `<span class="status-badge badge-approved">✅ Approved</span>`;
                            buttonHTML = p.fileUrl
                                ? `<a class="download-btn btn-approved-red" href="${escapeHtml(p.fileUrl)}" target="_blank" rel="noopener">Download PDF ⬇</a>`
                                : `<button class="download-btn download-btn-disabled" onclick="alert('No file link has been set for this product yet. Please contact the seller.')">Download PDF ⬇</button>`;
                        }
                    } else {
                        badgeHTML = `<span class="status-badge badge-pending">⏳ Pending</span>`;
                        buttonHTML = `<button class="download-btn download-btn-disabled" onclick="alert('Your payment request is pending approval! Once admin verifies it, the download button will turn RED.')">Verifying...</button>`;
                    }
                }

                const ratingHTML = rating
                    ? `<div class="rating-line">${'★'.repeat(Math.round(rating.avg))}${'☆'.repeat(5 - Math.round(rating.avg))} ${rating.avg} <span class="count">(${rating.count})</span></div>`
                    : `<div class="rating-line count">No reviews yet</div>`;

                const previewHTML = p.previewUrl
                    ? `<img src="${escapeHtml(p.previewUrl)}" alt="${escapeHtml(p.title)} preview" class="preview-thumb" loading="lazy" onclick="window.open('${escapeHtml(p.previewUrl)}','_blank')">`
                    : '';

                return `
                    <div class="product-card">
                        <div>
                            ${previewHTML}
                            <div class="card-header">
                                <span class="icon-box">📦</span>
                                <span class="tag">${escapeHtml(p.tag)}</span>
                            </div>
                            <h3 class="product-title">${escapeHtml(p.title)}</h3>
                            <p class="product-desc">${escapeHtml(p.desc)}</p>
                            ${ratingHTML}
                            <button class="review-link" onclick="openReviewModal('${p.id}')">⭐ Write a review</button>
                        </div>
                        <div class="card-bottom">
                            <span class="price">₹${escapeHtml(p.price)}</span>
                            ${badgeHTML}
                            ${buttonHTML}
                        </div>
                    </div>
                `;
            }).join('');

            injectProductSchema(filtered);
        }

        function injectProductSchema(products) {
            let scriptTag = document.getElementById('productSchema');
            if (!scriptTag) {
                scriptTag = document.createElement('script');
                scriptTag.type = 'application/ld+json';
                scriptTag.id = 'productSchema';
                document.head.appendChild(scriptTag);
            }
            const schema = {
                "@context": "https://schema.org",
                "@type": "ItemList",
                "itemListElement": products.map((p, i) => ({
                    "@type": "ListItem", "position": i + 1,
                    "item": {
                        "@type": "Product", "name": p.title, "description": p.desc || undefined, "category": p.tag || undefined,
                        "offers": { "@type": "Offer", "priceCurrency": "INR", "price": p.price, "availability": "https://schema.org/InStock" }
                    }
                }))
            };
            scriptTag.textContent = JSON.stringify(schema);
        }

        // ---------------------------------------------------------------
        // PAYMENT FLOW
        // ---------------------------------------------------------------
        function handleProductClick(id) {
            const prod = allProducts.find(p => p.id === id);
            if (!prod) { alert('This product is no longer available.'); return; }
            const order = myOrderStatus[id];
            if (order && order.status === 'Approved') {
                if (prod.fileUrl) window.open(prod.fileUrl, '_blank');
                else alert('No file link has been set for this product yet.');
            } else {
                openPaymentModal(id);
            }
        }

        function openPaymentModal(id) {
            activeProduct = allProducts.find(p => p.id === id);
            appliedCoupon = null;
            if (!activeProduct) return;

            document.getElementById('couponInput').value = '';
            document.getElementById('couponMsg').textContent = '';
            document.getElementById('modalError').style.display = 'none';
            updateModalPrice();
            document.getElementById('upiIdText').innerText = upiSettings.upiId
                ? 'UPI ID: ' + upiSettings.upiId
                : 'UPI ID: Not set up yet — contact the seller before paying.';
            document.getElementById('payModal').style.display = 'flex';
        }

        function updateModalPrice() {
            const base = Number(activeProduct.price);
            let final = base;
            let priceHTML = `₹${base}`;
            if (appliedCoupon) {
                final = appliedCoupon.type === 'percent'
                    ? Math.max(0, Math.round(base - (base * appliedCoupon.value / 100)))
                    : Math.max(0, Math.round(base - appliedCoupon.value));
                priceHTML = `<span class="strike">₹${base}</span> ₹${final}`;
            }
            document.getElementById('modalPrice').innerHTML = priceHTML;

            if (upiSettings.qrUrl) {
                document.getElementById('qrCodeImg').src = upiSettings.qrUrl;
            } else if (upiSettings.upiId) {
                const upiLink = `upi://pay?pa=${upiSettings.upiId}&pn=${encodeURIComponent('FactZone')}&am=${final}&cu=INR`;
                document.getElementById('qrCodeImg').src = `https://api.qrserver.com/v1/create-qr-code/?size=180x180&data=${encodeURIComponent(upiLink)}`;
            } else {
                document.getElementById('qrCodeImg').src = '';
            }
        }

        async function applyCoupon() {
            const code = document.getElementById('couponInput').value.trim().toUpperCase();
            const msgEl = document.getElementById('couponMsg');
            if (!code) { appliedCoupon = null; updateModalPrice(); msgEl.textContent = ''; return; }

            try {
                const snap = await db.collection('coupons').where('code', '==', code).limit(1).get();
                if (snap.empty || !snap.docs[0].data().active) {
                    appliedCoupon = null;
                    msgEl.className = 'coupon-msg err';
                    msgEl.textContent = 'Invalid or expired coupon code.';
                } else {
                    const c = snap.docs[0].data();
                    appliedCoupon = { code, type: c.type, value: Number(c.value) };
                    msgEl.className = 'coupon-msg ok';
                    msgEl.textContent = c.type === 'percent' ? `Applied: ${c.value}% off` : `Applied: ₹${c.value} off`;
                }
            } catch (e) {
                console.error('Coupon check failed:', e);
                msgEl.className = 'coupon-msg err';
                msgEl.textContent = 'Could not check coupon right now. Try again.';
                appliedCoupon = null;
            }
            updateModalPrice();
        }

        function closeModal() {
            document.getElementById('payModal').style.display = 'none';
            document.getElementById('utrNumber').value = '';
            document.getElementById('custName').value = '';
            document.getElementById('custContact').value = '';
            document.getElementById('modalError').style.display = 'none';
        }

        function showModalError(msg) {
            const el = document.getElementById('modalError');
            el.textContent = msg;
            el.style.display = 'block';
        }

        async function submitVerification() {
            const name = document.getElementById('custName').value.trim();
            const contact = document.getElementById('custContact').value.trim();
            const utr = document.getElementById('utrNumber').value.trim();

            if (!name) return showModalError('Please enter your name.');
            if (!/^\d{10}$/.test(contact)) return showModalError('Please enter a valid 10-digit mobile number.');
            if (!/^\d{12}$/.test(utr)) return showModalError('Please enter a valid 12-digit UTR/reference number.');

            const base = Number(activeProduct.price);
            const finalPrice = appliedCoupon
                ? (appliedCoupon.type === 'percent' ? Math.max(0, Math.round(base - base * appliedCoupon.value / 100)) : Math.max(0, Math.round(base - appliedCoupon.value)))
                : base;

            const submitBtn = document.getElementById('submitPaymentBtn');
            submitBtn.disabled = true;
            submitBtn.textContent = 'Submitting...';

            try {
                const docRef = await db.collection('orders').add({
                    productId: activeProduct.id,
                    productTitle: activeProduct.title,
                    name, contact, utr,
                    price: base,
                    couponCode: appliedCoupon ? appliedCoupon.code : null,
                    finalPrice,
                    status: 'Pending',
                    createdAt: firebase.firestore.FieldValue.serverTimestamp()
                });

                myOrders.push({ orderId: docRef.id, productId: activeProduct.id });
                localStorage.setItem('fz_my_orders', JSON.stringify(myOrders));
                await refreshMyOrderStatuses();
                renderProducts();

                // Free "click-to-send" WhatsApp alert to the seller — opens
                // WhatsApp with the order details pre-filled; the customer
                // just taps Send. No paid API/backend involved.
                if (upiSettings.adminWhatsapp) {
                    const text = encodeURIComponent(
                        `New order on FactZone\nProduct: ${activeProduct.title}\nAmount: ₹${finalPrice}\nName: ${name}\nContact: ${contact}\nUTR: ${utr}`
                    );
                    window.open(`https://wa.me/${upiSettings.adminWhatsapp}?text=${text}`, '_blank');
                }

                alert('✅ Payment details submitted!\n\nStatus is set to "Pending". As soon as Admin approves it from panel, this button will turn RED for instant download.');
                closeModal();
            } catch (e) {
                console.error('Order submit failed:', e);
                showModalError('Could not submit your request — check your internet connection and try again.');
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = 'Submit Payment Request';
            }
        }

        // ---------------------------------------------------------------
        // REVIEWS
        // ---------------------------------------------------------------
        function openReviewModal(productId) {
            activeReviewProductId = productId;
            selectedStars = 0;
            document.getElementById('reviewName').value = '';
            document.getElementById('reviewText').value = '';
            document.getElementById('reviewError').style.display = 'none';
            renderStars();
            document.getElementById('reviewModal').style.display = 'flex';
        }

        function closeReviewModal() {
            document.getElementById('reviewModal').style.display = 'none';
        }

        document.getElementById('starInput').addEventListener('click', (e) => {
            if (e.target.dataset.v) {
                selectedStars = Number(e.target.dataset.v);
                renderStars();
            }
        });

        function renderStars() {
            document.querySelectorAll('#starInput span').forEach(s => {
                s.classList.toggle('active', Number(s.dataset.v) <= selectedStars);
            });
        }

        async function submitReview() {
            const name = document.getElementById('reviewName').value.trim() || 'Anonymous';
            const text = document.getElementById('reviewText').value.trim();
            const errEl = document.getElementById('reviewError');

            if (!selectedStars) {
                errEl.textContent = 'Please select a star rating.';
                errEl.style.display = 'block';
                return;
            }

            const btn = document.getElementById('submitReviewBtn');
            btn.disabled = true;
            btn.textContent = 'Submitting...';

            try {
                await db.collection('reviews').add({
                    productId: activeReviewProductId,
                    name, text, rating: selectedStars,
                    createdAt: firebase.firestore.FieldValue.serverTimestamp()
                });
                closeReviewModal();
            } catch (e) {
                console.error('Review submit failed:', e);
                errEl.textContent = 'Could not submit review — please try again.';
                errEl.style.display = 'block';
            } finally {
                btn.disabled = false;
                btn.textContent = 'Submit Review';
            }
        }

        function toggleTheme() {
            const html = document.documentElement;
            const next = html.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
            html.setAttribute('data-theme', next);
            localStorage.setItem('fz_theme', next);
        }

        window.onload = () => {
            const savedTheme = localStorage.getItem('fz_theme');
            if (savedTheme) document.documentElement.setAttribute('data-theme', savedTheme);
            changeLanguage(currentLang);
        };
    </script>
</body>
