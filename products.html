<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Store - FactZone | eBooks, Canva Templates & Source Codes</title>

    <!-- SEO -->
    <meta name="description" content="Buy premium eBooks, Canva templates and source code files from FactZone Digital Store. Instant download, secure UPI payment.">
    <meta name="keywords" content="digital products, ebooks, canva templates, source code, UPI payment store India">
    <meta name="robots" content="index, follow">
    <meta name="author" content="FactZone">
    <link rel="canonical" href="https://www.factzone.example/products.html">
    <link rel="icon" href="https://factzone.online/logo.png" sizes="48x48" type="image/png">
    <link rel="apple-touch-icon" href="https://factzone.online/logo.png"> 

    <!-- Open Graph -->
    <meta property="og:type" content="website">
    <meta property="og:title" content="FactZone Digital Store">
    <meta property="og:description" content="Premium eBooks, Canva Templates, and Source Codes for Instant Download.">
    <meta property="og:url" content="https://factzone.online/products.html">
    <meta property="og:site_name" content="FactZone">

    <!-- Twitter -->
    <meta name="twitter:card" content="summary">
    <meta name="twitter:title" content="FactZone Digital Store">
    <meta name="twitter:description" content="Premium eBooks, Canva Templates, and Source Codes for Instant Download.">

    <!-- Performance: warm up connection to the QR image API -->
    <link rel="preconnect" href="https://api.qrserver.com">
    <link rel="dns-prefetch" href="https://api.qrserver.com">

    <!-- Breadcrumb structured data -->
    <script type="application/ld+json">
    {
        "@context": "https://schema.org",
        "@type": "BreadcrumbList",
        "itemListElement": [
            { "@type": "ListItem", "position": 1, "name": "Home", "item": "https://factzone.online/index.html" },
            { "@type": "ListItem", "position": 2, "name": "Store", "item": "https://factzone.online/products.html" }
        ]
    }
    </script>

    <style>
        :root {
            --bg-body: #ffffff;
            --bg-card: #f8fafc;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --primary: #0284c7;
            --primary-hover: #0369a1;
            --border: #e2e8f0;
            --price: #16a34a;
        }

        [data-theme="dark"] {
            --bg-body: #0f172a;
            --bg-card: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --primary: #38bdf8;
            --primary-hover: #0284c7;
            --border: #334155;
            --price: #22c55e;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: system-ui, sans-serif; }
        body { background-color: var(--bg-body); color: var(--text-main); line-height: 1.5; }

        header {
            background-color: var(--bg-card);
            border-bottom: 1px solid var(--border);
            padding: 0.75rem 1.25rem;
            display: flex; justify-content: space-between; align-items: center;
            position: sticky; top: 0; z-index: 1000;
        }

        .logo { font-size: 1.3rem; font-weight: 700; color: var(--primary); text-decoration: none; }
        .nav-right { display: flex; align-items: center; gap: 1rem; }
        .nav-links a { color: var(--text-main); text-decoration: none; font-weight: 500; font-size: 0.9rem; margin-right: 0.8rem; }

        .lang-select, .theme-toggle {
            background: var(--bg-body); border: 1px solid var(--border); color: var(--text-main);
            padding: 0.3rem 0.5rem; border-radius: 6px; font-size: 0.85rem; cursor: pointer;
        }

        .breadcrumb { max-width: 1200px; margin: 0.6rem auto 0; padding: 0 1rem; font-size: 0.8rem; color: var(--text-muted); }
        .breadcrumb a { color: var(--primary); text-decoration: none; }
        .breadcrumb a:hover { text-decoration: underline; }

        .hero { text-align: center; padding: 1rem 1rem 0.4rem; max-width: 800px; margin: 0 auto; }
        .hero h1 { font-size: 1.4rem; margin-bottom: 0.2rem; font-weight: 700; }
        .hero p { color: var(--text-muted); font-size: 0.85rem; }

        .container { max-width: 1200px; margin: 0 auto; padding: 0.8rem 1rem 1.5rem; }
        .product-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 1.25rem; }

        .product-card {
            background-color: var(--bg-card); border: 1px solid var(--border); border-radius: 10px;
            padding: 1.1rem; display: flex; flex-direction: column; justify-content: space-between;
        }

        .card-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 0.6rem; }
        .icon-box { font-size: 1.8rem; }
        .tag { background-color: rgba(2, 132, 199, 0.1); color: var(--primary); font-size: 0.75rem; padding: 0.15rem 0.5rem; border-radius: 4px; font-weight: 600; }
        .product-title { font-size: 1.1rem; font-weight: 600; margin-bottom: 0.4rem; }
        .product-desc { color: var(--text-muted); font-size: 0.85rem; margin-bottom: 0.8rem; }

        .card-bottom { display: flex; align-items: center; justify-content: space-between; border-top: 1px solid var(--border); padding-top: 0.8rem; gap: 0.5rem; flex-wrap: wrap; }
        .price { font-size: 1.25rem; font-weight: 700; color: var(--price); }

        .status-badge { font-size: 0.72rem; font-weight: 600; padding: 0.25rem 0.45rem; border-radius: 6px; text-align: center; white-space: nowrap; }
        .badge-info { background: rgba(2, 132, 199, 0.1); color: var(--primary); border: 1px solid rgba(2, 132, 199, 0.2); }
        .badge-pending { background: #fef08a; color: #854d0e; border: 1px solid #fde047; }
        .badge-approved { background: #dcfce7; color: #166534; border: 1px solid #86efac; }

        .download-btn { background-color: var(--primary); color: #ffffff; border: none; padding: 0.45rem 0.9rem; border-radius: 6px; font-size: 0.85rem; font-weight: 600; cursor: pointer; transition: 0.2s; }
        .download-btn:hover { background-color: var(--primary-hover); }

        .btn-approved-red { background-color: #ef4444 !important; color: #ffffff !important; animation: pulse 1.5s infinite; }
        .btn-approved-red:hover { background-color: #dc2626 !important; }
        .download-btn-disabled { background-color: #94a3b8 !important; cursor: not-allowed; }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.03); }
            100% { transform: scale(1); }
        }

        .empty-state { grid-column: 1 / -1; text-align: center; padding: 3rem 1rem; color: var(--text-muted); }
        .empty-state .icon-box { font-size: 2.5rem; display: block; margin-bottom: 0.5rem; }

        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.6); display: none; justify-content: center; align-items: center; z-index: 2000;
        }

        .modal {
            background: var(--bg-body); border-radius: 12px; padding: 1.5rem; max-width: 380px; width: 90%;
            text-align: center; border: 1px solid var(--border); position: relative;
        }

        .modal-close { position: absolute; top: 10px; right: 15px; background: none; border: none; font-size: 1.2rem; cursor: pointer; color: var(--text-main); }
        .qr-img { width: 180px; height: 180px; margin: 0.8rem auto; border-radius: 8px; border: 1px solid var(--border); object-fit: contain; background: #fff; }
        .upi-id { background: var(--bg-card); padding: 0.4rem; border-radius: 6px; font-weight: 600; font-size: 0.85rem; margin-bottom: 0.8rem; word-break: break-all; }
        .form-input { width: 100%; padding: 0.5rem; border: 1px solid var(--border); border-radius: 6px; margin-bottom: 0.6rem; font-size: 0.85rem; }
        .field-error { color: #ef4444; font-size: 0.75rem; text-align: left; margin: -0.4rem 0 0.6rem; display: none; }
        .verify-btn { background: var(--price); color: white; border: none; width: 100%; padding: 0.6rem; border-radius: 6px; font-weight: 600; cursor: pointer; }
        .verify-btn:disabled { opacity: 0.6; cursor: not-allowed; }

        footer { text-align: center; padding: 1.5rem 1rem; border-top: 1px solid var(--border); margin-top: 2rem; color: var(--text-muted); font-size: 0.8rem; }
    </style>
</head>
<body>

    <header>
        <a href="index.html" class="logo">FactZone</a>
        <div class="nav-right">
            <nav class="nav-links" aria-label="Primary">
                <a href="https://factzone.online/index.html" id="navTools">Tools</a>
                <a href="https://factzone.online/products.html" style="color:var(--primary);" id="navStore" aria-current="page">Store</a>
            </nav>
            <select class="lang-select" id="langSelector" onchange="changeLanguage(this.value)" aria-label="Language">
                <option value="en">🌐 English</option>
                <option value="hi">🌐 Hindi</option>
            </select>
            <button class="theme-toggle" onclick="toggleTheme()" aria-label="Toggle dark mode">🌓 Mode</button>
        </div>
    </header>

    <nav class="breadcrumb" aria-label="Breadcrumb">
        <a href="index.html">Home</a> &rsaquo; <span id="breadcrumbCurrent">Store</span>
    </nav>

    <main>
        <div class="hero">
            <h1 id="heroTitle">Digital Products Store</h1>
            <p id="heroDesc">Premium eBooks, Canva Templates, and Source Codes for Instant Download</p>
        </div>

        <div class="container">
            <div class="product-grid" id="productGrid"></div>
        </div>
    </main>

    <div class="modal-overlay" id="payModal" role="dialog" aria-modal="true" aria-labelledby="modalHeading">
        <div class="modal">
            <button class="modal-close" onclick="closeModal()" aria-label="Close">✕</button>
            <h3 id="modalHeading">Scan & Pay via UPI</h3>
            <p style="font-size: 0.8rem; color: var(--text-muted); margin-top: 0.2rem;">Amount: <strong id="modalPrice" style="color: var(--price);">₹0</strong></p>

            <img id="qrCodeImg" src="" alt="UPI QR Code" class="qr-img" loading="lazy">
            <div class="upi-id" id="upiIdText">UPI ID: Loading...</div>

            <input type="text" id="custName" class="form-input" placeholder="Your Name" required>
            <input type="text" id="custContact" class="form-input" placeholder="WhatsApp / Mobile Number" required maxlength="10" inputmode="numeric">
            <input type="text" id="utrNumber" class="form-input" placeholder="12-digit UTR/Ref Number" maxlength="12" required inputmode="numeric">
            <p class="field-error" id="modalError"></p>

            <button class="verify-btn" id="submitPaymentBtn" onclick="submitVerification()">Submit Payment Request</button>
        </div>
    </div>

    <footer>
        <p>&copy; 2026 FactZone. All Rights Reserved.</p>
    </footer>

    <script>
        const translations = {
            en: { tools: "Tools", store: "Store", heroTitle: "Digital Products Store", heroDesc: "Premium eBooks, Canva Templates, and Source Codes for Instant Download", btnText: "Download", empty: "No products available right now. Please check back soon." },
            hi: { tools: "टूल्स", store: "स्टोर", heroTitle: "डिजिटल प्रोडक्ट्स स्टोर", heroDesc: "प्रीमियम ई-बुक्स, कैनवा टेम्पलेट्स और सोर्स कोड्स तुरंत डाउनलोड करें", btnText: "डाउनलोड", empty: "अभी कोई प्रोडक्ट उपलब्ध नहीं है। कृपया बाद में देखें।" }
        };

        let currentLang = localStorage.getItem('fz_lang') || 'en';
        let activeProduct = null;

        function escapeHtml(str) {
            return String(str ?? '').replace(/[&<>"']/g, (c) => ({
                '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
            })[c]);
        }

        function safeGet(key, fallback) {
            try {
                const raw = localStorage.getItem(key);
                return raw ? JSON.parse(raw) : fallback;
            } catch (e) {
                console.error('Could not read "' + key + '" from storage:', e);
                return fallback;
            }
        }

        function safeSet(key, value) {
            try {
                localStorage.setItem(key, JSON.stringify(value));
                return true;
            } catch (e) {
                console.error('Could not save "' + key + '":', e);
                if (e && e.name === 'QuotaExceededError') {
                    alert('Storage is full, so this could not be saved. Large PDF/QR files take up a lot of space in the browser — try a smaller file, or remove an old product from the admin panel first.');
                } else {
                    alert('Something went wrong while saving. Please try again.');
                }
                return false;
            }
        }

        function changeLanguage(lang) {
            currentLang = lang;
            localStorage.setItem('fz_lang', lang);
            document.getElementById('langSelector').value = lang;
            document.getElementById('navTools').innerText = translations[lang].tools;
            document.getElementById('navStore').innerText = translations[lang].store;
            document.getElementById('breadcrumbCurrent').innerText = translations[lang].store;
            document.getElementById('heroTitle').innerText = translations[lang].heroTitle;
            document.getElementById('heroDesc').innerText = translations[lang].heroDesc;
            document.title = translations[lang].heroTitle + ' - FactZone';
            renderProducts();
        }

        function renderProducts() {
            const grid = document.getElementById('productGrid');
            // Real products only — no placeholder/demo items baked in.
            // The admin panel (mpadmin.html) is the only source of truth.
            const products = safeGet('fz_products', []);

            if (!products.length) {
                grid.innerHTML = `
                    <div class="empty-state">
                        <span class="icon-box">🛒</span>
                        <p>${escapeHtml(translations[currentLang].empty)}</p>
                    </div>`;
                injectProductSchema([]);
                return;
            }

            const pendingList = safeGet('fz_pending_orders', []);

            grid.innerHTML = products.map(p => {
                const userOrder = pendingList.find(o => o.productId == p.id);

                let badgeHTML = `<span class="status-badge badge-info">Approve in 24 hrs</span>`;
                let buttonAction = `onclick="handleProductClick(${p.id})"`;
                let buttonClass = `download-btn`;
                let buttonText = translations[currentLang].btnText;

                if (userOrder) {
                    if (userOrder.status === 'Approved') {
                        badgeHTML = `<span class="status-badge badge-approved">✅ Approved</span>`;
                        buttonClass = `download-btn btn-approved-red`;
                        buttonText = `Download PDF ⬇`;
                    } else {
                        badgeHTML = `<span class="status-badge badge-pending">⏳ Pending</span>`;
                        buttonClass = `download-btn download-btn-disabled`;
                        buttonText = `Verifying...`;
                        buttonAction = `onclick="alert('Your payment request is pending approval! Once admin verifies it, the download button will turn RED.')"`;
                    }
                }

                return `
                    <div class="product-card">
                        <div>
                            <div class="card-header">
                                <span class="icon-box">📦</span>
                                <span class="tag">${escapeHtml(p.tag)}</span>
                            </div>
                            <h3 class="product-title">${escapeHtml(p.title)}</h3>
                            <p class="product-desc">${escapeHtml(p.desc)}</p>
                        </div>
                        <div class="card-bottom">
                            <span class="price">₹${escapeHtml(p.price)}</span>
                            ${badgeHTML}
                            <button class="${buttonClass}" ${buttonAction}>${buttonText}</button>
                        </div>
                    </div>
                `;
            }).join('');

            injectProductSchema(products);
        }

        // Keeps an ItemList + Product JSON-LD block in sync with whatever
        // products are actually shown (SEO).
        function injectProductSchema(products) {
            let scriptTag = document.getElementById('productSchema');
            if (!scriptTag) {
                scriptTag = document.createElement('script');
                scriptTag.type = 'application/ld+json';
                scriptTag.id = 'productSchema';
                document.head.appendChild(scriptTag);
            }
            const schema = {
                "@context": "https://schema.org",
                "@type": "ItemList",
                "itemListElement": products.map((p, i) => ({
                    "@type": "ListItem",
                    "position": i + 1,
                    "item": {
                        "@type": "Product",
                        "name": p.title,
                        "description": p.desc || undefined,
                        "category": p.tag || undefined,
                        "offers": {
                            "@type": "Offer",
                            "priceCurrency": "INR",
                            "price": p.price,
                            "availability": "https://schema.org/InStock"
                        }
                    }
                }))
            };
            scriptTag.textContent = JSON.stringify(schema);
        }

        function handleProductClick(id) {
            const products = safeGet('fz_products', []);
            const pendingList = safeGet('fz_pending_orders', []);

            const prod = products.find(p => p.id == id);
            if (!prod) {
                alert('This product is no longer available.');
                renderProducts();
                return;
            }
            const userOrder = pendingList.find(o => o.productId == id);

            if (userOrder && userOrder.status === 'Approved') {
                downloadFileDirectly(prod.file, prod.title);
            } else {
                openPaymentModal(id);
            }
        }

        function openPaymentModal(id) {
            const products = safeGet('fz_products', []);
            activeProduct = products.find(p => p.id == id);
            const upiSettings = safeGet('fz_upi_settings', { upiId: '', qrImage: '' });

            if (!activeProduct) return;

            document.getElementById('modalError').style.display = 'none';
            document.getElementById('modalPrice').innerText = '₹' + activeProduct.price;
            document.getElementById('upiIdText').innerText = upiSettings.upiId
                ? 'UPI ID: ' + upiSettings.upiId
                : 'UPI ID: Not set up yet — contact the seller before paying.';

            if (upiSettings.qrImage) {
                document.getElementById('qrCodeImg').src = upiSettings.qrImage;
            } else if (upiSettings.upiId) {
                // Build a correctly-encoded UPI deep link, then encode the
                // WHOLE link for the QR API — the previous version only
                // escaped one "&", which produced a broken QR code.
                const upiLink = `upi://pay?pa=${upiSettings.upiId}&pn=${encodeURIComponent('FactZone')}&am=${activeProduct.price}&cu=INR`;
                document.getElementById('qrCodeImg').src =
                    `https://api.qrserver.com/v1/create-qr-code/?size=180x180&data=${encodeURIComponent(upiLink)}`;
            } else {
                document.getElementById('qrCodeImg').src = '';
            }

            document.getElementById('payModal').style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('payModal').style.display = 'none';
            document.getElementById('utrNumber').value = '';
            document.getElementById('custName').value = '';
            document.getElementById('custContact').value = '';
            document.getElementById('modalError').style.display = 'none';
        }

        function showModalError(msg) {
            const el = document.getElementById('modalError');
            el.textContent = msg;
            el.style.display = 'block';
        }

        function submitVerification() {
            const name = document.getElementById('custName').value.trim();
            const contact = document.getElementById('custContact').value.trim();
            const utr = document.getElementById('utrNumber').value.trim();

            if (!name) return showModalError('Please enter your name.');
            if (!/^\d{10}$/.test(contact)) return showModalError('Please enter a valid 10-digit mobile number.');
            if (!/^\d{12}$/.test(utr)) return showModalError('Please enter a valid 12-digit UTR/reference number.');

            const submitBtn = document.getElementById('submitPaymentBtn');
            submitBtn.disabled = true;
            submitBtn.textContent = 'Submitting...';

            let pending = safeGet('fz_pending_orders', []);
            pending = pending.filter(o => o.productId != activeProduct.id);

            pending.push({
                id: Date.now(),
                productId: activeProduct.id,
                name: name,
                contact: contact,
                product: activeProduct.title,
                price: activeProduct.price,
                utr: utr,
                status: 'Pending',
                date: new Date().toLocaleString()
            });

            const saved = safeSet('fz_pending_orders', pending);

            submitBtn.disabled = false;
            submitBtn.textContent = 'Submit Payment Request';

            if (!saved) return;

            alert('✅ Payment details submitted!\n\nStatus is set to "Pending". As soon as Admin approves it from panel, this button will turn RED for instant download.');
            closeModal();
            renderProducts();
        }

        function downloadFileDirectly(fileUrl, title) {
            if (fileUrl && fileUrl !== '#') {
                const a = document.createElement('a');
                a.href = fileUrl;
                a.download = title + '.pdf';
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
            } else {
                alert('No file has been uploaded for this product yet. Please contact the seller.');
            }
        }

        function toggleTheme() {
            const html = document.documentElement;
            const next = html.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
            html.setAttribute('data-theme', next);
            localStorage.setItem('fz_theme', next);
        }

        // Real-time sync: when mpadmin.html changes data in another tab,
        // reflect it here immediately.
        window.addEventListener('storage', function (e) {
            if (e.key === 'fz_pending_orders' || e.key === 'fz_products') {
                renderProducts();
            }
        });

        window.onload = () => {
            const savedTheme = localStorage.getItem('fz_theme');
            if (savedTheme) document.documentElement.setAttribute('data-theme', savedTheme);
            changeLanguage(currentLang);
        };
    </script>
</body>
</html>
